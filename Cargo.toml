[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["crates/spindle-observe-api"]

[workspace.package]
version = "0.13.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/beyond10x/spindle"
publish = false

[workspace.dependencies]
spindle-spec = { path = "crates/spindle-spec" }
spindle-capability = { path = "crates/spindle-capability" }
ess-compiler = { git = "https://github.com/beyond10x/ess", tag = "0.92.0" }
ess-conformance = { git = "https://github.com/beyond10x/ess", tag = "0.92.0" }
ess-domain = { git = "https://github.com/beyond10x/ess", tag = "0.92.0" }
ess-gen = { git = "https://github.com/beyond10x/ess", tag = "0.92.0" }
ess-http = { git = "https://github.com/beyond10x/ess", tag = "0.92.0" }
ess-primitives = { git = "https://github.com/beyond10x/ess", tag = "0.92.0" }
ess-yaml = { git = "https://github.com/beyond10x/ess", tag = "0.92.0" }
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
toml = "0.9"
