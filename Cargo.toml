[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["crates/spindle-observe-api"]

[workspace.package]
version = "0.21.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/beyond10x/spindle"
publish = false

[workspace.dependencies]
spindle-spec = { path = "crates/spindle-spec" }
spindle-capability = { path = "crates/spindle-capability" }
ess-compiler = { git = "https://github.com/beyond10x/ess", tag = "0.99.1" }
ess-conformance = { git = "https://github.com/beyond10x/ess", tag = "0.99.1" }
ess-domain = { git = "https://github.com/beyond10x/ess", tag = "0.99.1" }
ess-gen = { git = "https://github.com/beyond10x/ess", tag = "0.99.1" }
ess-http = { git = "https://github.com/beyond10x/ess", tag = "0.99.1" }
ess-primitives = { git = "https://github.com/beyond10x/ess", tag = "0.99.1" }
ess-yaml = { git = "https://github.com/beyond10x/ess", tag = "0.99.1" }
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
toml = "1.2"

[profile.dev.package."*"]
opt-level = 1

[profile.wasm-gate]
inherits = "dev"
debug = false
incremental = false

[profile.wasm-gate.package."*"]
opt-level = 0

[profile.wasm-lint]
inherits = "wasm-gate"
