version: '3'

vars:
  OBSERVE_ROOTS: --root spindle.observe.Deployment --root spindle.observe.Catalogue --root spindle.observe.Sample --root spindle.observe.StateChange --root spindle.observe.RequestLog --root spindle.observe.MetricFamilies --root spindle.observe.Topology
  OBSERVE_SCHEMAS: ess/generated/jsonschema/schema/types

tasks:
  check:
    desc: The repository gate
    cmds:
      - aep plan artifact validate
      - ess specify validate --path ess
      - ess specify validate --path examples/rally/ess
      - task: check:the_observe_domain_validates
      - task: check:the_generated_types_have_no_drift
      - task: check:every_fixture_answer_validates_against_its_schema
      - task: check:ui
      - task: docs-check
      - task: check:conformance
      - task: check:the_wasm_build_of_the_host_succeeds
      - task: check:a_command_runs_in_wasm_on_the_memory_store
      - task: check:the_browser_store_keeps_state_in_indexeddb
      - task: check:a_service_worker_serves_a_specification
      - task: check:the_static_bundle_builds
      - cargo fmt -- --check
      - cargo clippy --workspace --all-targets --locked -- -D warnings
      - cargo test --workspace --locked --no-fail-fast

  check:conformance:
    desc: Spindle runs the suite ESS synthesises from ess/ with the scenarios ess-inputs.yaml lists, every executed scenario passing and its counts held
    cmds:
      - mkdir -p target/conformance
      - ess conform synthesize --path ess --scenarios ess --out target/conformance/suite.json
      - cargo run -q --locked -p spindle-cli -- conform ess --environment examples/environments/laptop.toml --suite target/conformance/suite.json --counts conformance.toml --report target/conformance/report.json --results target/conformance/results.json

  check:the_wasm_build_of_the_host_succeeds:
    desc: spindle-spec, spindle-kernel, spindle-host and the spindle-ingress router build for wasm32-unknown-unknown without SQLite or the listener, and nothing they compile there reads std's clock
    env:
      CLIPPY_CONF_DIR: '{{.ROOT_DIR}}/clippy/wasm32'
    cmds:
      - cargo build --locked --target wasm32-unknown-unknown --no-default-features -p spindle-spec -p spindle-kernel -p spindle-host -p spindle-ingress
      - cargo clippy --locked --target wasm32-unknown-unknown --no-default-features -p spindle-spec -p spindle-kernel -p spindle-host -p spindle-ingress -p spindle-timer -p spindle-channel -p spindle-telemetry -p spindle-capability -p spindle-store-browser -p spindle-wasm --lib -- -D warnings

  check:a_command_runs_in_wasm_on_the_memory_store:
    desc: The wasm host runs a command on the memory store, under wasm-bindgen-test-runner on Node
    env:
      CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
    cmds:
      - cargo test --locked --target wasm32-unknown-unknown --no-default-features -p spindle-host --test spindle-host

  check:the_browser_store_keeps_state_in_indexeddb:
    desc: The IndexedDB store passes the store contract and keeps its state across a reopen, in a headless browser under wasm-bindgen-test-runner
    env:
      CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
    cmds:
      - cargo test --locked --target wasm32-unknown-unknown -p spindle-store-browser --test spindle-store-browser

  check:a_service_worker_serves_a_specification:
    desc: The wasm host answers a specification's routes and the console routes inside a Service Worker of a headless browser, as the loopback listener answers them, under wasm-bindgen-test-runner
    env:
      CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
    cmds:
      - cargo test --locked --target wasm32-unknown-unknown -p spindle-wasm --test spindle-wasm

  check:the_static_bundle_builds:
    desc: The Service Worker site in web/ builds, spindle-wasm compiled to wasm32-unknown-unknown and bound by wasm-bindgen into the Vite bundle
    cmds:
      - task: web

  web:
    desc: Build the Service Worker site into web/dist
    cmds:
      - cargo build --locked --release --target wasm32-unknown-unknown -p spindle-wasm
      - wasm-bindgen --target web --out-dir web/src/wasm target/wasm32-unknown-unknown/release/spindle_wasm.wasm
      - task: web:bundle

  web:bundle:
    desc: Typecheck and bundle web/ with the bindings web/src/wasm holds
    dir: web
    cmds:
      - pnpm install --frozen-lockfile
      - pnpm typecheck
      - pnpm build

  check:postgres:
    desc: The PostgreSQL store's and the state move's tests against the database SPINDLE_TEST_DATABASE_URL names (loopback, a role that may create schemas, roles and tables), the hosted cases over TLS verified against SPINDLE_TEST_DATABASE_CA
    requires:
      vars: [SPINDLE_TEST_DATABASE_URL, SPINDLE_TEST_DATABASE_CA]
    cmds:
      - 'cargo test --locked -p spindle-kernel --test spindle-kernel -- --include-ignored postgres::'
      - 'cargo test --locked -p spindle-cli --test spindle-cli -- --include-ignored postgres::'
      - 'cargo test --locked -p spindle-cli --test spindle-cli -- --include-ignored state_move::'

  check:vm:
    desc: The VM tests, on a host with KVM
    cmds:
      - cargo test --locked -p spindle-qemu -p spindle-firecracker -- --include-ignored

  check:ui:
    desc: The observe UI's tests, typecheck and build, the UI and the panel
    dir: ui
    cmds:
      - pnpm install --frozen-lockfile
      - pnpm test
      - pnpm typecheck
      - pnpm build
      - pnpm build:panel

  build:
    desc: Release build of b10x-spindle, the observe UI built first and embedded
    cmds:
      - task: ui
      - cargo build --locked --release -p spindle-cli

  ui:
    desc: Build the observe UI into ui/dist and the panel into ui/dist-panel, which b10x-spindle embeds
    dir: ui
    cmds:
      - pnpm install --frozen-lockfile
      - pnpm build
      - pnpm build:panel

  docs-generate:
    desc: Rewrite the generated pages under website/
    cmds:
      - cargo run -q --locked -p spindle-docs -- generate

  docs-check:
    desc: Fail when a generated page is missing, stale or edited by hand, or a status item names a missing test
    cmds:
      - cargo run -q --locked -p spindle-docs -- generate --check

  website:
    desc: Install the site's locked dependencies and build it, as the documentation workflow does
    dir: website
    cmds:
      - npm ci --allow-git=root
      - npm run build

  generate:observe:
    desc: Regenerate the observe API schema and types from ess/
    cmds:
      - ess generate --path ess --kind schema --schema-id-base https://beyond10x.github.io/spindle/schema/ --out ess/generated/jsonschema
      - ess generate types --path ess --target rust --package spindle-observe-api --names short {{.OBSERVE_ROOTS}} --out crates/spindle-observe-api
      - ess generate types --path ess --target typescript --names short {{.OBSERVE_ROOTS}} --out ui/src/api/generated

  check:the_observe_domain_validates:
    desc: spindle.observe validates and declares every API answer
    cmds:
      - ess specify validate --path ess --strict-requires
      - ess generate types --path ess --target typescript --names short {{.OBSERVE_ROOTS}} --out ui/src/api/generated --check

  check:the_generated_types_have_no_drift:
    desc: The committed schema, Rust and TypeScript projections equal a fresh generation
    cmds:
      - ess generate --path ess --kind schema --schema-id-base https://beyond10x.github.io/spindle/schema/ --out ess/generated/jsonschema --check
      - ess generate types --path ess --target rust --package spindle-observe-api --names short {{.OBSERVE_ROOTS}} --out crates/spindle-observe-api --check
      - ess generate types --path ess --target typescript --names short {{.OBSERVE_ROOTS}} --out ui/src/api/generated --check
      - cargo check --locked --manifest-path crates/spindle-observe-api/Cargo.toml --target-dir target/observe-api

  check:every_fixture_answer_validates_against_its_schema:
    desc: Every observe fixture validates against the schema of its answer
    vars:
      BUNDLES:
        sh: mktemp -d
    cmds:
      - defer: rm -rf {{.BUNDLES}}
      - for: [Deployment, Catalogue, Sample, StateChange, RequestLog, MetricFamilies, Topology]
        cmd: ess generate schema import-document --path {{.OBSERVE_SCHEMAS}}/spindle.observe.{{.ITEM}}.schema.json --root spindle.observe.{{.ITEM}}.document --dialect draft-2020-12 --out {{.BUNDLES}}/{{.ITEM}}.json
      - ess generate schema validate-bundle --bundle {{.BUNDLES}}/Deployment.json --root spindle.observe.Deployment.document ess/fixtures/observe/deployment.json
      - ess generate schema validate-bundle --bundle {{.BUNDLES}}/Catalogue.json --root spindle.observe.Catalogue.document ess/fixtures/observe/catalogue/*.json
      - ess generate schema validate-bundle --bundle {{.BUNDLES}}/Sample.json --root spindle.observe.Sample.document ess/fixtures/observe/samples/*/*.json
      - ess generate schema validate-bundle --bundle {{.BUNDLES}}/StateChange.json --root spindle.observe.StateChange.document ess/fixtures/observe/state/*.json
      - ess generate schema validate-bundle --bundle {{.BUNDLES}}/RequestLog.json --root spindle.observe.RequestLog.document ess/fixtures/observe/requests/*.json
      - ess generate schema validate-bundle --bundle {{.BUNDLES}}/MetricFamilies.json --root spindle.observe.MetricFamilies.document ess/fixtures/observe/metrics/families.json
      - ess generate schema validate-bundle --bundle {{.BUNDLES}}/Topology.json --root spindle.observe.Topology.document ess/fixtures/observe/topology/*.json
