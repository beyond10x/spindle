version: '3'

env:
  ESS_TOOLCHAIN: '0.99.1'

vars:
  OBSERVE_ROOTS: --root spindle.observe.Deployment --root spindle.observe.Catalogue --root spindle.observe.Sample --root spindle.observe.StateChange --root spindle.observe.RequestLog --root spindle.observe.MetricFamilies --root spindle.observe.Topology --root spindle.observe.ServedOperations
  OBSERVE_SCHEMAS: ess/generated/jsonschema/schema/types

tasks:
  check:
    desc: The repository gate
    cmds:
      - aep plan artifact validate
      - task: check:the_ess_pin_is_one_release
      - task: check:changed_paths_are_classified
      - task: check:the_release_binary_checks_refuse_what_they_must
      - task: check:within_fails_over_its_bound
      - ess specify validate --path ess
      - ess specify validate --path examples/rally/ess
      - task: check:the_observe_domain_validates
      - task: check:the_generated_types_have_no_drift
      - task: check:every_fixture_answer_validates_against_its_schema
      - task: check:ui
      - task: docs-check
      - task: check:conformance
      - task: check:the_wasm_lanes_share_one_cache_key
      - sh scripts/within.sh 120 {{.TASK_EXE}} check:the_wasm_build_of_the_host_succeeds
      - sh scripts/within.sh 120 {{.TASK_EXE}} check:a_command_runs_in_wasm_on_the_memory_store
      - sh scripts/within.sh 120 {{.TASK_EXE}} check:the_browser_store_keeps_state_in_indexeddb
      - sh scripts/within.sh 120 {{.TASK_EXE}} check:a_service_worker_serves_a_specification
      - sh scripts/within.sh 120 {{.TASK_EXE}} check:the_static_bundle_builds
      - sh scripts/within.sh 120 {{.TASK_EXE}} check:node_serves_a_specification
      - cargo fmt -- --check
      - cargo clippy --workspace --all-targets --locked -- -D warnings
      - task: check:the_tests_pass_within_the_budget

  check:the_ess_pin_is_one_release:
    desc: ess/ess-inputs.yaml requires one exact ESS release, and ESS_TOOLCHAIN in Taskfile.yml and .cargo/config.toml and ESS_VERSION in the CI workflow name the same one
    cmds:
      - sh scripts/check-ess-pin.sh

  check:changed_paths_are_classified:
    desc: scripts/changed-paths.sh, the one path list CI reads, answers planning for .engineering/ and prose only, docs when a website/ file is added and code for any other path
    cmds:
      - sh scripts/changed-paths.sh test
      - sh scripts/gate-scripts.adversary-test.sh

  check:the_release_binary_checks_refuse_what_they_must:
    desc: scripts/release-linux-binary.sh, the release job's glibc floor, static and image checks, refuses a binary over the floor, one that is not static and an image not pinned by digest, on stub tools; and release.yml's target lists equal its build matrix
    cmds:
      - sh scripts/release-linux-binary.adversary-test.sh

  check:within_fails_over_its_bound:
    desc: scripts/within.sh, the timer of the test step and the wasm lanes, passes a command within its bound, fails one that runs over it and passes on a failing command's own status
    cmds:
      - sh scripts/within.sh 5 true
      - if sh scripts/within.sh 1 sleep 2; then echo "within.sh passed a 2-second sleep with a 1-second bound" >&2; exit 1; fi
      - sh -c 'sh scripts/within.sh 5 sh -c "exit 3"; status=$?; [ "$status" -eq 3 ] || { echo "within.sh answered $status for a command that exits 3" >&2; exit 1; }'

  check:the_tests_pass_within_the_budget:
    desc: Every Rust test of the workspace under cargo-nextest, each killed at 60 s by .config/nextest.toml; the step after the build ends within 120 s and prints its ten slowest tests
    cmds:
      - cargo nextest run --workspace --locked --no-run
      - defer: { task: test:slowest }
      - sh scripts/within.sh 120 cargo nextest run --workspace --locked

  test:slowest:
    desc: The ten slowest tests of the last nextest run, read from its JUnit report
    cmds:
      - if [ -f target/nextest/default/junit.xml ]; then echo "the ten slowest tests:"; sed -n 's/.*<testcase name="\([^"]*\)" classname="\([^"]*\)".* time="\([0-9.]*\)".*/\3 s  \2 \1/p' target/nextest/default/junit.xml | sort -rn | head -n 10; fi

  check:conformance:
    desc: Spindle runs the suite ESS synthesises from ess/ with the scenarios ess-inputs.yaml lists, every executed scenario passing and its counts held
    cmds:
      - mkdir -p target/conformance
      - ess conform synthesize --path ess --scenarios ess --out target/conformance/suite.json
      - cargo run -q --locked -p spindle-cli -- conform ess --environment examples/environments/laptop.toml --suite target/conformance/suite.json --counts conformance.toml --report target/conformance/report.json --results target/conformance/results.json

  check:the_wasm_lanes_share_one_cache_key:
    desc: scripts/wasm-cache-key.sh, on its stub cases, the adversary's cases and this tree, fails when the Taskfile sets a CARGO_* variable, when a wasm lane builds in a profile other than wasm-gate (lint wasm-lint), when one of the six lanes is not run under within.sh 120 or holds no wasm cargo command it reads, and when .cargo/config.toml names no wasm runner, so the wasm lanes share one compile-cache key; the two case sets run side by side
    deps:
      - wasm:cache-key:cases
      - wasm:cache-key:adversary
    cmds:
      - sh scripts/wasm-cache-key.sh check

  wasm:cache-key:cases:
    desc: The stub cases of scripts/wasm-cache-key.sh
    cmds:
      - sh scripts/wasm-cache-key.sh test

  wasm:cache-key:adversary:
    desc: The adversary's cases of scripts/wasm-cache-key.sh, each a change to this tree's Taskfile.yml or .cargo/config.toml
    cmds:
      - sh scripts/adversary_w27_u6.sh

  check:the_wasm_build_of_the_host_succeeds:
    desc: spindle-spec, spindle-kernel, spindle-host and the spindle-ingress router build for wasm32-unknown-unknown without SQLite or the listener, and nothing they compile there reads std's clock; the build and the lint run side by side, each in a profile directory of its own
    deps:
      - task: wasm:host:build
      - task: wasm:host:lint

  wasm:host:build:
    desc: The build of check:the_wasm_build_of_the_host_succeeds
    cmds:
      - cargo build --locked --profile wasm-gate --target wasm32-unknown-unknown --no-default-features -p spindle-spec -p spindle-kernel -p spindle-host -p spindle-ingress -p spindle-embed

  wasm:host:lint:
    desc: The lint of check:the_wasm_build_of_the_host_succeeds, std's clock refused by clippy/wasm32
    env:
      CLIPPY_CONF_DIR: '{{.ROOT_DIR}}/clippy/wasm32'
    cmds:
      - cargo clippy --locked --profile wasm-lint --target wasm32-unknown-unknown --no-default-features -p spindle-spec -p spindle-kernel -p spindle-host -p spindle-ingress -p spindle-timer -p spindle-channel -p spindle-telemetry -p spindle-capability -p spindle-store-browser -p spindle-wasm -p spindle-embed -p spindle-node --lib -- -D warnings

  check:a_command_runs_in_wasm_on_the_memory_store:
    desc: The wasm host runs a command on the memory store, under wasm-bindgen-test-runner on Node
    env:
      WASM_BINDGEN_TEST_TIMEOUT: '60'
    cmds:
      - cargo test --locked --profile wasm-gate --target wasm32-unknown-unknown --no-default-features -p spindle-host --test spindle-host

  check:the_browser_store_keeps_state_in_indexeddb:
    desc: The IndexedDB store passes the store contract and keeps its state across a reopen, in a headless browser under wasm-bindgen-test-runner
    env:
      WASM_BINDGEN_TEST_TIMEOUT: '60'
    cmds:
      - cargo test --locked --profile wasm-gate --target wasm32-unknown-unknown -p spindle-store-browser --test spindle-store-browser

  check:a_service_worker_serves_a_specification:
    desc: The wasm host answers a specification's routes and the console routes inside a Service Worker of a headless browser, as the loopback listener answers them, under wasm-bindgen-test-runner
    env:
      WASM_BINDGEN_TEST_TIMEOUT: '60'
    cmds:
      - cargo test --locked --profile wasm-gate --target wasm32-unknown-unknown -p spindle-wasm --test spindle-wasm

  check:node_serves_a_specification:
    desc: The Node export, spindle-node bound by wasm-bindgen as an ES module, answers a specification's routes and the console routes in-process as the loopback listener answers them, under node --test
    cmds:
      - cargo build --locked --profile wasm-gate --target wasm32-unknown-unknown -p spindle-node
      - wasm-bindgen --target web --out-dir target/spindle-node target/wasm32-unknown-unknown/wasm-gate/spindle_node.wasm
      - node --test --test-timeout=60000 'crates/spindle-node/tests/node/*.test.mjs'

  check:the_static_bundle_builds:
    desc: The Service Worker site in web/ builds, spindle-wasm compiled to wasm32-unknown-unknown and bound by wasm-bindgen into the Vite bundle
    cmds:
      - cargo build --locked --profile wasm-gate --target wasm32-unknown-unknown -p spindle-wasm
      - task: web:bind
        vars:
          PROFILE: wasm-gate

  web:
    desc: Build the Service Worker site into web/dist, spindle-wasm built in the release profile, or in PROFILE
    vars:
      PROFILE: '{{.PROFILE | default "release"}}'
    cmds:
      - cargo build --locked --profile {{.PROFILE}} --target wasm32-unknown-unknown -p spindle-wasm
      - task: web:bind
        vars:
          PROFILE: '{{.PROFILE}}'

  web:bind:
    desc: Bind spindle-wasm of the profile PROFILE into web/src/wasm with wasm-bindgen, then typecheck and bundle web/
    requires:
      vars: [PROFILE]
    cmds:
      - wasm-bindgen --target web --out-dir web/src/wasm target/wasm32-unknown-unknown/{{.PROFILE}}/spindle_wasm.wasm
      - task: web:bundle

  web:bundle:
    desc: Typecheck and bundle web/ with the bindings web/src/wasm holds
    dir: web
    cmds:
      - pnpm install --frozen-lockfile
      - pnpm typecheck
      - pnpm build

  check:postgres:
    desc: The PostgreSQL store's and the state move's tests against the database SPINDLE_TEST_DATABASE_URL names (loopback, a role that may create schemas, roles and tables), the hosted cases over TLS verified against SPINDLE_TEST_DATABASE_CA
    requires:
      vars: [SPINDLE_TEST_DATABASE_URL, SPINDLE_TEST_DATABASE_CA]
    cmds:
      - 'cargo test --locked -p spindle-kernel --test spindle-kernel -- --include-ignored postgres::'
      - 'cargo test --locked -p spindle-kernel --test spindle-kernel -- --include-ignored state_move::'
      - 'cargo test --locked -p spindle-kernel --test spindle-kernel -- --include-ignored on_postgres adversary_w21_store::'
      - 'cargo test --locked -p spindle-kernel --test spindle-kernel -- --include-ignored adversary_postgres_named:: adversary_postgres_scan:: --skip adv2_sqlite_scans_the_same_long_logs --skip adv3_a_scan_of_1300_rows_of_a_mebibyte_each'
      - 'cargo test --locked -p spindle-host --test spindle-host -- --include-ignored postgres::'
      - 'cargo test --locked -p spindle-cli --test spindle-cli -- --include-ignored postgres::'
      - 'cargo test --locked -p spindle-cli --test spindle-cli -- --include-ignored state_move::'

  check:vm:
    desc: The VM tests, on a host with KVM
    cmds:
      - cargo test --locked -p spindle-qemu -p spindle-firecracker -- --include-ignored

  check:ui:
    desc: The observe UI's tests, typecheck and build, the UI and the panel
    dir: ui
    cmds:
      - pnpm install --frozen-lockfile
      - pnpm test
      - pnpm typecheck
      - pnpm build
      - pnpm build:panel

  build:
    desc: Release build of b10x-spindle, the observe UI built first and embedded
    cmds:
      - task: ui
      - cargo build --locked --release -p spindle-cli

  ui:
    desc: Build the observe UI into ui/dist and the panel into ui/dist-panel, which b10x-spindle embeds
    dir: ui
    cmds:
      - pnpm install --frozen-lockfile
      - pnpm build
      - pnpm build:panel

  docs-generate:
    desc: Rewrite the generated pages under website/
    cmds:
      - cargo run -q --locked -p spindle-docs -- generate

  docs-check:
    desc: Fail when a generated page is missing, stale or edited by hand, or a status item names a missing test
    cmds:
      - cargo run -q --locked -p spindle-docs -- generate --check

  website:
    desc: Install the site's locked dependencies, build it and typecheck it, as the documentation workflow does
    dir: website
    cmds:
      - npm ci --allow-git=root
      - npm run build
      - npm run typecheck

  ux:docs:
    desc: The documentation site's UX fast loop, hermetic and without keys - the site built, website/ux's unit and findings tests, the layout contract and the screen-only reader at the gating viewports in both themes, then the ratchet against website/ux/baseline.json (Playwright's Chromium must be installed)
    dir: website/ux
    cmds:
      - task: website
      - npm ci
      - npm test
      - npm run typecheck
      - npx playwright test -c playwright.config.ts --project=gating
      - node cli/round.ts measure
      - node cli/ratchet.ts

  ux:docs:baseline:
    desc: Take the last ux:docs measurement into website/ux/baseline.json; a worse value needs DECISION=<id>
    dir: website/ux
    cmds:
      - node cli/round.ts measure
      - node cli/ratchet.ts --update {{if .DECISION}}--decision {{.DECISION}}{{end}}

  ux:docs:round:
    desc: 'Measure a round of the documentation site, ROUND=R-nn (STAGE=after for the re-measure) - every viewport, then website/ux/rounds/<ROUND>/ report.md, round.json, shots/ and trend.md'
    dir: website/ux
    requires:
      vars: [ROUND]
    cmds:
      - task: website
      - npm ci
      - cmd: npx playwright test -c playwright.config.ts
        ignore_error: true
      - node cli/round.ts write {{.ROUND}} {{.STAGE}}

  generate:observe:
    desc: Regenerate the observe API schema and types from ess/
    cmds:
      - ess generate --path ess --kind schema --schema-id-base https://beyond10x.github.io/spindle/schema/ --out ess/generated/jsonschema
      - ess generate types --path ess --target rust --package spindle-observe-api --names short {{.OBSERVE_ROOTS}} --out crates/spindle-observe-api
      - ess generate types --path ess --target typescript --names short {{.OBSERVE_ROOTS}} --out ui/src/api/generated

  check:the_observe_domain_validates:
    desc: spindle.observe validates and declares every API answer
    cmds:
      - ess specify validate --path ess --strict-requires
      - ess generate types --path ess --target typescript --names short {{.OBSERVE_ROOTS}} --out ui/src/api/generated --check

  check:the_generated_types_have_no_drift:
    desc: The committed schema, Rust and TypeScript projections equal a fresh generation
    cmds:
      - ess generate --path ess --kind schema --schema-id-base https://beyond10x.github.io/spindle/schema/ --out ess/generated/jsonschema --check
      - ess generate types --path ess --target rust --package spindle-observe-api --names short {{.OBSERVE_ROOTS}} --out crates/spindle-observe-api --check
      - ess generate types --path ess --target typescript --names short {{.OBSERVE_ROOTS}} --out ui/src/api/generated --check
      - cargo check --locked --manifest-path crates/spindle-observe-api/Cargo.toml --target-dir target/observe-api

  check:every_fixture_answer_validates_against_its_schema:
    desc: Every observe fixture validates against the schema of its answer
    vars:
      BUNDLES:
        sh: mktemp -d
    cmds:
      - defer: rm -rf {{.BUNDLES}}
      - for: [Deployment, Catalogue, Sample, StateChange, RequestLog, MetricFamilies, Topology, ServedOperations]
        cmd: ess generate schema import-document --path {{.OBSERVE_SCHEMAS}}/spindle.observe.{{.ITEM}}.schema.json --root spindle.observe.{{.ITEM}}.document --dialect draft-2020-12 --out {{.BUNDLES}}/{{.ITEM}}.json
      - ess generate schema validate-bundle --bundle {{.BUNDLES}}/Deployment.json --root spindle.observe.Deployment.document ess/fixtures/observe/deployment.json
      - ess generate schema validate-bundle --bundle {{.BUNDLES}}/Catalogue.json --root spindle.observe.Catalogue.document ess/fixtures/observe/catalogue/*.json
      - ess generate schema validate-bundle --bundle {{.BUNDLES}}/Sample.json --root spindle.observe.Sample.document ess/fixtures/observe/samples/*/*.json
      - ess generate schema validate-bundle --bundle {{.BUNDLES}}/StateChange.json --root spindle.observe.StateChange.document ess/fixtures/observe/state/*.json
      - ess generate schema validate-bundle --bundle {{.BUNDLES}}/RequestLog.json --root spindle.observe.RequestLog.document ess/fixtures/observe/requests/*.json
      - ess generate schema validate-bundle --bundle {{.BUNDLES}}/MetricFamilies.json --root spindle.observe.MetricFamilies.document ess/fixtures/observe/metrics/families.json
      - ess generate schema validate-bundle --bundle {{.BUNDLES}}/Topology.json --root spindle.observe.Topology.document ess/fixtures/observe/topology/*.json
      - ess generate schema validate-bundle --bundle {{.BUNDLES}}/ServedOperations.json --root spindle.observe.ServedOperations.document ess/fixtures/observe/served/*.json
