    outcome: planned
  - at: 2026-01-05T09:00:27Z
    command: spindle.placement.PlaceInstance
    input:
      instance_id: of-refused
    outcome: placed
  - at: 2026-01-05T09:00:28Z
    command: spindle.deployment.DecideAdmission
    input:
      deployment_id: refused
      requires: [store.durable]
      bindings: []
      missing: [store.durable]
    outcome: refused
  - at: 2026-01-05T09:00:29Z
    command: spindle.placement.LaunchInstance
    input:
      instance_id: of-refused
    outcome: not-admitted
    error:
      name: spindle.placement.DeploymentNotAdmitted
      fields: {deployment_id: refused}
assert:
  - view: spindle.placement.InstanceState
    contains: {instance_id: of-offered, state: Placed}
  - view: spindle.placement.InstanceState
    contains: {instance_id: of-admitted, state: Running}
  - view: spindle.placement.InstanceState
    contains: {instance_id: of-running, state: Running}
  - view: spindle.placement.InstanceState
    contains: {instance_id: of-stopped, state: Placed}
  - view: spindle.placement.InstanceState
    contains: {instance_id: of-refused, state: Placed}
