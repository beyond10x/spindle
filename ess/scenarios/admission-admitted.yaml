type: ess-scenario/1
domain: spindle.deployment
scenario: admission-admitted
summary: >-
  A decision binding each required capability to an implementation its exact key lists is
  admitted and kept; one binding an unlisted implementation is not provided.
timeline:
  - at: 2026-01-05T09:00:00Z
    command: spindle.deployment.DeclareEnvironment
    input:
      environment_id: laptop
      os: linux
      arch: x86_64
      provides:
        - capability: store.durable
          implementations: [sqlite, memory]
        - capability: channel
          implementations: [in-process]
    outcome: declared
  - at: 2026-01-05T09:00:01Z
    command: spindle.deployment.OfferBundle
    input:
      deployment_id: unlisted
      bundle: sha256:0f
      environment_id: laptop
    outcome: offered
  - at: 2026-01-05T09:00:02Z
    command: spindle.deployment.DecideAdmission
    input:
      deployment_id: unlisted
      requires: [store.durable]
      bindings:
        - capability: store.durable
          implementation: postgres
      missing: []
    outcome: not-provided
    error:
      name: spindle.deployment.AdmissionDecisionInvalid
      fields: {}
  - at: 2026-01-05T09:00:03Z
    command: spindle.deployment.OfferBundle
    input:
      deployment_id: bound
      bundle: sha256:0f
      environment_id: laptop
    outcome: offered
  - at: 2026-01-05T09:00:04Z
    command: spindle.deployment.DecideAdmission
    input:
      deployment_id: bound
      requires: [store.durable]
      bindings:
        - capability: store.durable
          implementation: sqlite
      missing: []
    outcome: admitted
assert:
  - view: spindle.deployment.DeploymentState
    contains: {deployment_id: unlisted, state: Offered}
  - view: spindle.deployment.DeploymentState
    contains:
      deployment_id: bound
      state: Admitted
      requires: [store.durable]
      bindings:
        - capability: store.durable
          implementation: sqlite
