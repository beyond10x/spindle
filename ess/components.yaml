components:
  - component: spindle-control
    summary: Holds environments, deployments, targets and instances; decides admission and placement.
    owns:
      domains:
        - spindle.deployment
        - spindle.placement
        - spindle.observe
    accepts:
      commands:
        - spindle.deployment.DeclareEnvironment
        - spindle.deployment.OfferBundle
        - spindle.deployment.DecideAdmission
        - spindle.deployment.StartDeployment
        - spindle.deployment.StopDeployment
        - spindle.placement.DeclareTarget
        - spindle.placement.RetireTarget
        - spindle.placement.PlanInstance
        - spindle.placement.PlaceInstance
        - spindle.placement.LaunchInstance
        - spindle.placement.ReportExit
    publishes:
      events:
        - spindle.deployment.EnvironmentDeclared
        - spindle.deployment.BundleOffered
        - spindle.deployment.DeploymentAdmitted
        - spindle.deployment.DeploymentRefused
        - spindle.deployment.DeploymentStarted
        - spindle.deployment.DeploymentStopped
        - spindle.placement.TargetDeclared
        - spindle.placement.TargetRetired
        - spindle.placement.InstancePlanned
        - spindle.placement.InstancePlaced
        - spindle.placement.InstanceRefused
        - spindle.placement.InstanceLaunched
        - spindle.placement.InstanceExited
    # UNMAPPED: how a caller proves which actor it is, and with which attributes, has no place in
    # this format: a served surface is handed the authenticated caller, and the contract never
    # states how a request proves it. `reached_by: network` is the one construct that makes the
    # specification state what a request with no caller is answered (the standard refusal, naming
    # no actor). It is not declared: no caller outside the process sends these commands, and the
    # control process answers reads only. Open question for the owner
    # (story:ingress-caller-identity-specified).
    reached_by: in_process
