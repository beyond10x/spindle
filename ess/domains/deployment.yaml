domain: spindle.deployment

summary: >-
  A bundle is offered to an environment, admitted or refused against the capabilities that
  environment provides, then started and stopped.

naming:
  wire: deployments
  display: Deployments

types:
  - name: spindle.deployment.DeploymentId
    kind: newtype
    of: String

  - name: spindle.deployment.BundleDigest
    kind: newtype
    of: String

  - name: spindle.deployment.EnvironmentId
    kind: newtype
    of: String

  - name: spindle.deployment.CapabilityName
    kind: newtype
    of: String

  - name: spindle.deployment.ImplementationName
    kind: newtype
    of: String

  - name: spindle.deployment.Binding
    kind: struct
    fields:
      - name: capability
        type: spindle.deployment.CapabilityName
      - name: implementation
        type: spindle.deployment.ImplementationName

entities:
  - name: spindle.deployment.Environment

    identity:
      name: environment_id
      type: spindle.deployment.EnvironmentId

    fields:
      - name: os
        type: String
      - name: arch
        type: String
      - name: provides
        type: List<spindle.deployment.Binding>

    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]
      transitions: []

  - name: spindle.deployment.Deployment

    identity:
      name: deployment_id
      type: spindle.deployment.DeploymentId

    fields:
      - name: bundle
        type: spindle.deployment.BundleDigest
      - name: environment_id
        type: spindle.deployment.EnvironmentId
      - name: requires
        type: Optional<List<spindle.deployment.CapabilityName>>
      - name: bindings
        type: Optional<List<spindle.deployment.Binding>>
      - name: missing
        type: Optional<List<spindle.deployment.CapabilityName>>

    relations:
      - name: environment
        kind: references
        target: spindle.deployment.Environment
        cardinality: one
        via: environment_id

    lifecycle:
      initial: Offered
      states: [Offered, Admitted, Refused, Running, Stopped]
      terminal: [Refused, Stopped]
      transitions:
        - name: admit
          from: [Offered]
          to: Admitted
        - name: refuse
          from: [Offered]
          to: Refused
        - name: start
          from: [Admitted]
          to: Running
        - name: stop
          from: [Admitted, Running]
          to: Stopped

actors:
  - name: spindle.deployment.Operator
    may:
      - spindle.deployment.DeclareEnvironment
      - spindle.deployment.OfferBundle
      - spindle.deployment.StartDeployment
      - spindle.deployment.StopDeployment
    naming:
      display: Operator

  - name: spindle.deployment.Admission
    may:
      - spindle.deployment.DecideAdmission
    naming:
      display: Admission

errors:
  - name: spindle.deployment.DeploymentStateConflict
    summary: The deployment is not in a state this command acts from, so nothing moved.
    fields:
      - name: state
        type: spindle.deployment.Deployment.State

  - name: spindle.deployment.AdmissionDecisionInvalid
    summary: >-
      The decision binds a capability twice, binds one that is not required or to an
      implementation the environment does not provide for it, names missing one that is not
      required, that it binds or that the environment provides, leaves a required one neither
      bound nor missing, or refuses where no capability it names missing is confirmed missing, so
      nothing moved.
    fields: []

  - name: spindle.deployment.EnvironmentUnknown
    summary: No environment is declared under the identity the offer names, so nothing moved.
    fields: []

commands:
  - name: spindle.deployment.DeclareEnvironment
    naming:
      wire: declare-environment
      display: Declare environment
    input:
      - name: environment_id
        type: spindle.deployment.EnvironmentId
      - name: os
        type: String
      - name: arch
        type: String
      - name: provides
        type: List<spindle.deployment.Binding>
    outcomes:
      - name: declared
        creates: spindle.deployment.Environment
        instance: environment_id
        emits:
          - spindle.deployment.EnvironmentDeclared
        payload:
          spindle.deployment.EnvironmentDeclared:
            environment_id: input.environment_id
        sets:
          os: input.os
          arch: input.arch
          provides: input.provides
        summary: The environment and the capabilities it provides are recorded.

  - name: spindle.deployment.OfferBundle
    naming:
      wire: offer-bundle
      display: Offer bundle
    input:
      - name: deployment_id
        type: spindle.deployment.DeploymentId
      - name: bundle
        type: spindle.deployment.BundleDigest
      - name: environment_id
        type: spindle.deployment.EnvironmentId
    outcomes:
      - name: unknown-environment
        when_related:
          via: input.environment_id
          exists: false
        error: spindle.deployment.EnvironmentUnknown
        summary: No environment is declared under `environment_id`, so nothing was offered.

      - name: offered
        creates: spindle.deployment.Deployment
        instance: deployment_id
        emits:
          - spindle.deployment.BundleOffered
        payload:
          spindle.deployment.BundleOffered:
            deployment_id: input.deployment_id
            bundle: input.bundle
        sets:
          bundle: input.bundle
          environment_id: input.environment_id
        summary: >-
          The bundle is offered to a declared environment. The offer names no capability: what the
          bundle requires is the admitter's answer, given with its decision.

  - name: spindle.deployment.DecideAdmission
    naming:
      wire: decide-admission
      display: Decide admission
    input:
      - name: deployment_id
        type: spindle.deployment.DeploymentId
      - name: requires
        type: List<spindle.deployment.CapabilityName>
        summary: >-
          The capabilities the bundle requires, as the admitter derives them from the bundle's
          compiled specification; never written by the bundle's author.
      - name: bindings
        type: List<spindle.deployment.Binding>
      - name: missing
        type: List<spindle.deployment.CapabilityName>
        summary: >-
          The required capabilities the admitter finds no implementation for in the environment.
    outcomes:
      - name: bound-twice
        when:
          not:
            distinct: {in: bindings, as: b, by: b.capability}
        error: spindle.deployment.AdmissionDecisionInvalid
        summary: The decision binds one capability to two implementations, so nothing moved.

      - name: not-decided
        when:
          not:
            all:
              - forall:
                  in: bindings
                  as: b
                  that: {exists: {in: requires, as: c, that: b.capability == c}}
              - forall:
                  in: missing
                  as: m
                  that:
                    all:
                      - {exists: {in: requires, as: c, that: m == c}}
                      - {not: {exists: {in: bindings, as: b, that: b.capability == m}}}
              - forall:
                  in: requires
                  as: c
                  that:
                    any:
                      - {exists: {in: bindings, as: b, that: b.capability == c}}
                      - {exists: {in: missing, as: m, that: m == c}}
        error: spindle.deployment.AdmissionDecisionInvalid
        summary: >-
          The decision binds a capability that is not required, names one missing that is not
          required or that it binds, or leaves a required one neither bound nor missing, so nothing
          moved, whether or not admission was already decided.

      - name: wrong-state
        wrong_state: true
        error: spindle.deployment.DeploymentStateConflict
        summary: >-
          The decision is consistent, but the deployment's admission was already decided, so
          nothing moved. The held state answers before the environment is read, so a binding the
          environment does not provide is answered here too once admission was decided.

      - name: not-provided
        when_related:
          via: environment_id
          predicate:
            exists:
              in: input.bindings
              as: b
              that:
                not:
                  exists:
                    in: provides
                    as: p
                    that:
                      all:
                        - p.capability == b.capability
                        - p.implementation == b.implementation
        error: spindle.deployment.AdmissionDecisionInvalid
        summary: >-
          The decision binds a capability to an implementation the deployment's environment does
          not provide for it, so nothing moved.

      - name: missing-provided
        when_related:
          via: environment_id
          predicate:
            exists:
              in: input.missing
              as: m
              that: {exists: {in: provides, as: p, that: p.capability == m}}
        error: spindle.deployment.AdmissionDecisionInvalid
        summary: >-
          The decision names missing a capability the deployment's environment provides, so
          nothing moved. Declared beside `not-provided`, it answers before `refused` is read.

      - name: admitted
        when: missing.count == 0
        moves: spindle.deployment.Deployment.admit
        instance: deployment_id
        emits:
          - spindle.deployment.DeploymentAdmitted
        payload:
          spindle.deployment.DeploymentAdmitted:
            deployment_id: input.deployment_id
        sets:
          requires: input.requires
          bindings: input.bindings
        summary: >-
          Every required capability is bound to exactly one implementation the environment
          provides for it, and nothing that is not required is bound. `requires` and the bindings
          are the admitter's answer; the model checks them against each other and against the
          environment's `provides`, and keeps both.

      - name: refused
        external: at least one required capability has no implementation in the environment
        when: missing.count >= 1
        moves: spindle.deployment.Deployment.refuse
        instance: deployment_id
        emits:
          - spindle.deployment.DeploymentRefused
        payload:
          spindle.deployment.DeploymentRefused:
            deployment_id: input.deployment_id
            missing: input.missing
        sets:
          requires: input.requires
          missing: input.missing
        summary: >-
          The deployment is refused. `missing` names at least one required capability, none the
          decision binds, and every required capability is bound or missing. No capability named
          missing is in the environment's `provides`, and none bound is outside it, so `missing`
          is exactly what the environment lacks of `requires`; the external cause confirms it.

      - name: unconfirmed
        error: spindle.deployment.AdmissionDecisionInvalid
        summary: >-
          The decision refuses, but the environment's admission does not confirm a capability it
          names missing, so nothing moved.

  - name: spindle.deployment.StartDeployment
    naming:
      wire: start-deployment
      display: Start deployment
    input:
      - name: deployment_id
        type: spindle.deployment.DeploymentId
    outcomes:
      - name: started
        moves: spindle.deployment.Deployment.start
        instance: deployment_id
        emits:
          - spindle.deployment.DeploymentStarted
        payload:
          spindle.deployment.DeploymentStarted:
            deployment_id: input.deployment_id
        summary: The runtime loads the bundle with its bindings and starts its loop.

      - name: wrong-state
        wrong_state: true
        error: spindle.deployment.DeploymentStateConflict
        summary: Only an admitted deployment starts.

  - name: spindle.deployment.StopDeployment
    naming:
      wire: stop-deployment
      display: Stop deployment
    input:
      - name: deployment_id
        type: spindle.deployment.DeploymentId
    outcomes:
      - name: stopped
        moves: spindle.deployment.Deployment.stop
        instance: deployment_id
        emits:
          - spindle.deployment.DeploymentStopped
        payload:
          spindle.deployment.DeploymentStopped:
            deployment_id: input.deployment_id
        summary: The loop drains and the deployment ends.

      - name: already-ended
        wrong_state: true
        refuses: false
        summary: >-
          A deployment still offered, refused or stopped stays as it is; a stop does not withdraw
          an offer whose admission is undecided.

events:
  - name: spindle.deployment.EnvironmentDeclared
    fields:
      - name: environment_id
        type: spindle.deployment.EnvironmentId

  - name: spindle.deployment.BundleOffered
    fields:
      - name: deployment_id
        type: spindle.deployment.DeploymentId
      - name: bundle
        type: spindle.deployment.BundleDigest

  - name: spindle.deployment.DeploymentAdmitted
    fields:
      - name: deployment_id
        type: spindle.deployment.DeploymentId

  - name: spindle.deployment.DeploymentRefused
    fields:
      - name: deployment_id
        type: spindle.deployment.DeploymentId
      - name: missing
        type: List<spindle.deployment.CapabilityName>

  - name: spindle.deployment.DeploymentStarted
    fields:
      - name: deployment_id
        type: spindle.deployment.DeploymentId

  - name: spindle.deployment.DeploymentStopped
    fields:
      - name: deployment_id
        type: spindle.deployment.DeploymentId

views:
  - name: spindle.deployment.DeploymentState
    source: spindle.deployment.Deployment
    consistency: read_your_writes
    fields:
      - name: deployment_id
        type: spindle.deployment.DeploymentId
      - name: state
        type: spindle.deployment.Deployment.State
      - name: bundle
        type: spindle.deployment.BundleDigest
      - name: environment_id
        type: spindle.deployment.EnvironmentId
      - name: requires
        type: Optional<List<spindle.deployment.CapabilityName>>
      - name: bindings
        type: Optional<List<spindle.deployment.Binding>>
      - name: missing
        type: Optional<List<spindle.deployment.CapabilityName>>

  - name: spindle.deployment.EnvironmentState
    source: spindle.deployment.Environment
    consistency: read_your_writes
    fields:
      - name: environment_id
        type: spindle.deployment.EnvironmentId
      - name: state
        type: spindle.deployment.Environment.State
      - name: provides
        type: List<spindle.deployment.Binding>
