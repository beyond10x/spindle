domain: spindle.observe

summary: >-
  What the control process answers about a running deployment: the components and bindings of the
  system, the instances with their target, request and state, the counters the runtime derives for
  each component, and the samples each instance sends; and what a served run answers under its
  reserved prefix `/__spindle/` when it observes its ingress: the requests it answered, how each
  was classed, the metric families it exposes, and the topology of what it serves with live
  numbers per edge. Every noun here is an answer, read only; no command changes it.

naming:
  wire: observe
  display: Observe

types:
  - name: spindle.observe.Deployment
    kind: struct
    naming:
      summary: The answer of `GET /api/deployment`, the system as deployed.
    fields:
      - name: system
        type: String
        summary: The system identifier of the deployed specification.
      - name: components
        type: List<spindle.observe.Component>
      - name: bindings
        type: List<spindle.observe.Binding>
      - name: instances
        type: List<spindle.observe.DeployedInstance>

  - name: spindle.observe.Component
    kind: struct
    naming:
      summary: One component of the system, with the domains it owns and what it accepts and serves.
    fields:
      - name: name
        type: String
      - name: domains
        type: List<String>
        summary: The qualified names of the domains the component owns.
      - name: commands
        type: List<String>
        summary: The qualified names of the commands the component accepts.
      - name: views
        type: List<String>
        summary: The qualified names of the views the component serves.

  - name: spindle.observe.BindingKind
    kind: enum
    variants: [periodic, event]

  - name: spindle.observe.Binding
    kind: struct
    naming:
      summary: >-
        One binding of the system. A periodic binding fires a command of `to` on a schedule and has
        no `from` and no `event`; an event binding carries `event` from `from` to a command of `to`.
        The schedule is ESS's, not Spindle's. Seven keys of the binding's `when.periodic` cause are
        published, each answered with the word the specification declares, as ESS defines it (ESS
        guide "Declare a periodic host cause", `ess_domain::binding::periodic`): `every`,
        `anchor`, `first`, `cadence`, `overlap`, `missed` and `lifetime`, which together say when
        a tick is due and which ticks are dropped. They are present for a periodic binding and
        absent for an event binding. The cause's two other keys, `cancellation` and `host`, are
        not published; `crates/spindle-timer/src/lib.rs` honours `cancellation` and
        `host.eligibility` too.
    fields:
      - name: name
        type: String
      - name: kind
        type: spindle.observe.BindingKind
      - name: from
        type: Optional<String>
        summary: The component that publishes the event; absent for a periodic binding.
      - name: to
        type: String
        summary: The component that accepts the command.
      - name: event
        type: Optional<String>
        summary: The qualified name of the event carried; absent for a periodic binding.
      - name: command
        type: String
        summary: The qualified name of the command the binding issues.
      - name: every
        type: Optional<String>
        summary: >-
          ESS's `when.periodic.every`, the period as `PT<seconds>S`, such as `PT1S`; tick n is due
          one period after tick n-1 on the binding's grid. Absent for an event binding.
      - name: anchor
        type: Optional<String>
        summary: >-
          ESS's `when.periodic.anchor`, such as `host_activation`: the grid starts at the instant
          the binding's lifetime is activated. Absent for an event binding.
      - name: first
        type: Optional<String>
        summary: >-
          ESS's `when.periodic.first`, such as `after_period`: nothing is due at activation, and
          the first tick is one period later. Absent for an event binding.
      - name: cadence
        type: Optional<String>
        summary: >-
          ESS's `when.periodic.cadence`, such as `fixed_rate`: tick n is due at activation plus n
          periods, and completing a tick does not move the grid. Absent for an event binding.
      - name: overlap
        type: Optional<String>
        summary: >-
          ESS's `when.periodic.overlap`, such as `serial_per_instance`: no second tick is issued
          while one is still open. Absent for an event binding.
      - name: missed
        type: Optional<String>
        summary: >-
          ESS's `when.periodic.missed`, such as `one_pending_drop_excess`: deadlines that pass
          while a tick is open or unobserved keep one pending tick, the earliest, and the rest are
          dropped and counted. Absent for an event binding.
      - name: lifetime
        type: Optional<String>
        summary: >-
          ESS's `when.periodic.lifetime`, such as `host_instance`: a lifetime runs from activation
          to acknowledged stop and holds no durable state, so a new host instance starts a new
          grid. Absent for an event binding.

  - name: spindle.observe.DeployedInstance
    kind: struct
    naming:
      summary: One instance of a component, where it was placed, what it requested and its state.
    fields:
      - name: instance_id
        type: spindle.placement.InstanceId
      - name: component
        type: String
      - name: target_kind
        type: spindle.placement.TargetKind
      - name: target
        type: spindle.placement.TargetId
      - name: state
        type: spindle.placement.Instance.State
      - name: requested
        type: spindle.placement.Resources
      - name: started_at
        type: Optional<Timestamp>
        summary: When the instance was launched; absent until it runs.

  - name: spindle.observe.CounterKind
    kind: enum
    variants: [counter, histogram]

  - name: spindle.observe.CounterSource
    kind: enum
    variants: [kernel, store, channel, timer, ingress, view, resource]

  - name: spindle.observe.Catalogue
    kind: struct
    naming:
      summary: >-
        The answer of `GET /api/catalogue?component=`, every counter the runtime derives for one
        component from the compiled specification.
    fields:
      - name: component
        type: String
      - name: counters
        type: List<spindle.observe.Counter>

  - name: spindle.observe.Counter
    kind: struct
    naming:
      summary: One counter of the catalogue, by its dotted name, such as `command.rally.table.Tick.served`.
    fields:
      - name: name
        type: String
      - name: kind
        type: spindle.observe.CounterKind
      - name: source
        type: spindle.observe.CounterSource

  - name: spindle.observe.Sample
    kind: struct
    naming:
      summary: >-
        One `sample` message of `GET /api/stream`: the cumulative counters of one instance at one
        instant. A lost sample is harmless, because the next one carries every total again.
    fields:
      - name: instance_id
        type: spindle.placement.InstanceId
      - name: sequence
        type: Integer
        summary: Monotonic per instance, starting at 0.
      - name: at
        type: Timestamp
      - name: period_ms
        type: Integer
        summary: The sampling period the instance runs with, in milliseconds.
      - name: counters
        type: List<spindle.observe.CounterValue>
      - name: histograms
        type: List<spindle.observe.Histogram>
      - name: recent
        type: List<spindle.observe.RecentAnswer>
        summary: The last command answers of the instance, newest first.
      - name: resources
        type: spindle.observe.ResourceReading
      - name: dropped_frames
        type: Integer
        summary: Samples the instance dropped since launch because the control process was slow or gone.
    invariants:
      - sequence >= 0
      - period_ms > 0
      - dropped_frames >= 0

  - name: spindle.observe.CounterValue
    kind: struct
    naming:
      summary: The cumulative value of one counter of the catalogue.
    fields:
      - name: name
        type: String
      - name: value
        type: Integer
    invariants:
      - value >= 0

  - name: spindle.observe.Histogram
    kind: struct
    naming:
      summary: >-
        The cumulative buckets of one histogram of the catalogue. `bounds` are the inclusive upper
        bounds of the buckets in ascending order; `counts` has one entry per bound and one more for
        the values above the last bound; `sum_us` is the sum of the observed values in
        microseconds.
    fields:
      - name: name
        type: String
      - name: bounds
        type: List<Integer>
      - name: counts
        type: List<Integer>
      - name: sum_us
        type: Integer

  - name: spindle.observe.Payload
    kind: newtype
    of: String
    naming:
      summary: An event payload as JSON text, truncated to at most 1 KiB.
    invariants:
      - value.utf8_bytes <= 1024

  - name: spindle.observe.RecentAnswer
    kind: struct
    naming:
      summary: One command the instance executed, its outcome and the events it appended.
    fields:
      - name: at
        type: Timestamp
      - name: command
        type: String
      - name: outcome
        type: String
      - name: events
        type: List<String>
      - name: payload
        type: Optional<spindle.observe.Payload>
        summary: The payload of the first event appended, if any.

  - name: spindle.observe.ResourceReading
    kind: struct
    naming:
      summary: >-
        What the instance costs the host. A share is the reading against the instance's request:
        `cpu_share` is CPU seconds over wall seconds times requested vCPUs, `memory_share` is memory
        over requested MiB. An instance without a limit has no share.
    fields:
      - name: cpu_seconds
        type: Binary64
      - name: memory_bytes
        type: Integer
      - name: cpu_share
        type: Optional<Binary64>
      - name: memory_share
        type: Optional<Binary64>
    invariants:
      - cpu_seconds >= 0
      - memory_bytes >= 0

  - name: spindle.observe.StateChange
    kind: struct
    naming:
      summary: One `state` message of `GET /api/stream`, an instance moving from one state to another.
    fields:
      - name: instance_id
        type: spindle.placement.InstanceId
      - name: from
        type: spindle.placement.Instance.State
      - name: to
        type: spindle.placement.Instance.State
      - name: at
        type: Timestamp

  - name: spindle.observe.RequestClass
    kind: enum
    naming:
      summary: >-
        How a served run answered one request; the class follows who answered, not the status.
        `served`: the model answered it, with an outcome the command declares or the view's rows,
        whatever status the binding gives that outcome, `501` and `503` included. `refused`: the
        ingress or ESS's standard refusal answered it `4xx` before the model did, other than
        `not-granted`. `not-granted`: `403` "not granted", no grant admits the actor.
        `not-served`: spindle's own `501`, for an operation this ingress cannot route, the kernel
        does not run or the host does not read, or for an external cause nothing answered.
        `failed`: a `5xx` spindle itself answered, other than that `501`. `unrouted`: no route
        has the path, or not under that method.
    variants: [served, refused, not-granted, not-served, failed, unrouted]

  - name: spindle.observe.OperationKind
    kind: enum
    naming:
      summary: What a routed request was for.
    variants: [command, view, console]

  - name: spindle.observe.AnswerSource
    kind: enum
    naming:
      summary: >-
        What answered one external cause of a served command. `world`: the `decisions` of the
        world the last reset loaded, `spindle.console.World`. `file`: the decisions file.
        `default`: the default branch `--answer-default` takes. `unanswered`: nothing did, and the
        command answered `501`. Source: `crates/spindle-cli/src/decisions.rs:35-53`,
        `crates/spindle-ingress/src/observe.rs:186-209`.
    variants: [world, file, default, unanswered]

  - name: spindle.observe.ExternalAnswer
    kind: struct
    naming:
      summary: >-
        One external cause a command asked about while a served request was answered, and what
        answered it.
    fields:
      - name: command
        type: String
        summary: >-
          The qualified command that asked: the routed command, or one an event binding invoked
          while the request was answered; the `command` label of
          `spindle_external_causes_total`.
      - name: outcome
        type: String
        summary: The outcome whose cause was asked about, as the command declares it.
      - name: holds
        type: Optional<Boolean>
        summary: Whether the cause holds; absent when nothing answered it.
      - name: source
        type: spindle.observe.AnswerSource

  - name: spindle.observe.RequestRecord
    kind: struct
    naming:
      summary: >-
        One request a served run answered, as `GET /__spindle/requests` lists it. Requests under
        `/__spindle/` are not recorded.
    fields:
      - name: sequence
        type: Integer
        summary: Monotonic per run, starting at 0; a gap in a list is a request the ring dropped.
      - name: at
        type: Timestamp
        summary: When the request's head was read.
      - name: method
        type: String
        summary: The request's method, upper case.
      - name: path
        type: String
        summary: The request's path, without the query string.
      - name: route
        type: Optional<String>
        summary: The route template the path resolved to; absent for an unrouted request.
      - name: operation
        type: Optional<String>
        summary: >-
          The qualified command or view the route is bound to, or the console route as `GET
          /api/model`; absent for an unrouted request.
      - name: kind
        type: Optional<spindle.observe.OperationKind>
      - name: status
        type: Integer
        summary: The HTTP status answered.
      - name: class
        type: spindle.observe.RequestClass
      - name: outcome
        type: Optional<String>
        summary: The outcome the model selected, for a command it answered.
      - name: reason
        type: Optional<String>
        summary: >-
          The `refused` text of the answer, as the caller received it, for every class but
          `served`.
      - name: duration_us
        type: Integer
        summary: From the request's head read to its answer handed back, in microseconds.
      - name: events
        type: List<String>
        summary: The qualified names of the events the command published, in order.
      - name: externals
        type: List<spindle.observe.ExternalAnswer>
        summary: >-
          Every external cause asked while the request was answered, in the order asked: by the
          routed command and by every command an event binding invoked on the way.
    invariants:
      - sequence >= 0
      - status >= 100
      - status <= 599
      - duration_us >= 0

  - name: spindle.observe.RequestTotals
    kind: struct
    naming:
      summary: >-
        The requests a served run answered since it started, per class; requests under
        `/__spindle/` are not counted. Enough for a one-line banner.
    fields:
      - name: served
        type: Integer
      - name: refused
        type: Integer
      - name: not_granted
        type: Integer
      - name: not_served
        type: Integer
      - name: failed
        type: Integer
      - name: unrouted
        type: Integer
    invariants:
      - served >= 0
      - refused >= 0
      - not_granted >= 0
      - not_served >= 0
      - failed >= 0
      - unrouted >= 0

  - name: spindle.observe.RequestLogFormat
    kind: enum
    naming:
      summary: >-
        The format of a request log, `spindle-requests/1`; a reader refuses any other, and the
        schema refuses any other value.
    variants: [spindle-requests/1]

  - name: spindle.observe.RequestLog
    kind: struct
    naming:
      summary: >-
        The answer of `GET /__spindle/requests`: the totals since the run started and the last
        requests the ring holds, newest first, those of the classes `?class=` names where it is
        given.
    fields:
      - name: format
        type: spindle.observe.RequestLogFormat
      - name: capacity
        type: Integer
        summary: How many requests the ring holds at most, from 1 to 10 000.
      - name: recorded
        type: Integer
        summary: Every request recorded since the run started, kept or dropped by the ring.
      - name: totals
        type: spindle.observe.RequestTotals
      - name: requests
        type: List<spindle.observe.RequestRecord>
    invariants:
      - capacity > 0
      - capacity <= 10000
      - recorded >= 0

  - name: spindle.observe.MetricKind
    kind: enum
    naming:
      summary: The Prometheus type of a metric family.
    variants: [counter, gauge, histogram]

  - name: spindle.observe.MetricFamily
    kind: struct
    naming:
      summary: >-
        One metric family `GET /__spindle/metrics` exposes in the Prometheus text format, by its
        name, type and label names. The exposition's `# HELP` line is `summary`.
    fields:
      - name: name
        type: String
      - name: kind
        type: spindle.observe.MetricKind
      - name: labels
        type: List<String>
        summary: The label names every sample of the family carries, in order.
      - name: summary
        type: String

  - name: spindle.observe.MetricFamilies
    kind: struct
    naming:
      summary: Every metric family a served run exposes when it observes its ingress.
    fields:
      - name: families
        type: List<spindle.observe.MetricFamily>

  - name: spindle.observe.NodeKind
    kind: enum
    naming:
      summary: >-
        What one node of the topology stands for. `ingress`: the run's router, one per listener.
        `specification`: one loaded specification. `domain`: a domain of a specification.
        `command`, `view`, `event`: one declared in a domain. `external`: one external cause of a
        command's outcome. `binding`: one event or periodic binding, the channel an event travels.
    variants: [ingress, specification, domain, command, view, event, external, binding]

  - name: spindle.observe.EdgeKind
    kind: enum
    naming:
      summary: >-
        What one edge of the topology carries. `routes`: the ingress hands a request to a command
        or view. `contains`: a specification holds a domain, a domain a command, view or event.
        `asks`: a command asks an external cause. `emits`: a command's outcome emits an event.
        `carries`: an event travels a binding. `invokes`: a binding invokes a command, also one of
        another specification behind the same ingress.
    variants: [routes, contains, asks, emits, carries, invokes]

  - name: spindle.observe.TopologyNode
    kind: struct
    naming:
      summary: One node of the topology, derived from the loaded specifications, never authored.
    fields:
      - name: id
        type: String
        summary: >-
          Unique within one specification's topology: `ingress`; the specification's system
          identifier; a domain, command, view or event by its qualified name prefixed by its
          kind, such as `command:tasks.board.OpenTask`; an external cause by its command and
          outcome, such as `external:tasks.ledger.Settle/settled`; a binding by its binding id,
          not a qualified name, as `binding:<binding id>`, such as `binding:record-closure`. A
          binding id is unique only within its specification; how ids stay unique across
          several specifications behind one ingress is for
          `story:one-ingress-several-specifications` to settle.
      - name: kind
        type: spindle.observe.NodeKind
      - name: name
        type: String
        summary: The name as the specification writes it.
      - name: specification
        type: Optional<String>
        summary: The system identifier of the specification it belongs to; absent for the ingress.

  - name: spindle.observe.StatusClass
    kind: enum
    naming:
      summary: >-
        The class of an HTTP status by its first digit, as the `status_class` label of
        `spindle_http_requests_total` writes it.
    variants: [2xx, 3xx, 4xx, 5xx]

  - name: spindle.observe.StatusCount
    kind: struct
    naming:
      summary: How many requests of one status class an edge carried since the run started.
    fields:
      - name: status_class
        type: spindle.observe.StatusClass
      - name: count
        type: Integer
    invariants:
      - count >= 0

  - name: spindle.observe.SourceCount
    kind: struct
    naming:
      summary: How many times one source answered the external cause an `asks` edge leads to.
    fields:
      - name: source
        type: spindle.observe.AnswerSource
      - name: count
        type: Integer
    invariants:
      - count >= 0

  - name: spindle.observe.EdgeTraffic
    kind: struct
    naming:
      summary: >-
        The live numbers of one edge since the run started, read from the counters
        `GET /__spindle/metrics` exposes and the ring `GET /__spindle/requests` holds.
    fields:
      - name: count
        type: Integer
        summary: >-
          Requests a `routes` edge handed on, events an `emits` edge emitted, envelopes a
          `carries` edge sent, commands an `invokes` edge invoked, questions an `asks` edge asked.
      - name: statuses
        type: List<spindle.observe.StatusCount>
        summary: For a `routes` edge, the count per status class; empty for every other kind.
      - name: sources
        type: List<spindle.observe.SourceCount>
        summary: For an `asks` edge, the count per answer source; empty for every other kind.
      - name: latest
        type: List<Integer>
        summary: >-
          For a `routes` edge, the sequences of its latest requests still in the ring, newest
          first, at most 5; each names a record of `GET /__spindle/requests`.
    invariants:
      - count >= 0

  - name: spindle.observe.TopologyEdge
    kind: struct
    naming:
      summary: One edge of the topology, from one node to another, with its live numbers.
    fields:
      - name: from
        type: String
        summary: The `id` of the node it leaves.
      - name: to
        type: String
        summary: The `id` of the node it reaches.
      - name: kind
        type: spindle.observe.EdgeKind
      - name: traffic
        type: Optional<spindle.observe.EdgeTraffic>
        summary: Absent for a `contains` edge, which carries nothing.

  - name: spindle.observe.TopologyFormat
    kind: enum
    naming:
      summary: >-
        The format of a topology, `spindle-topology/1`; a reader refuses any other, and the
        schema refuses any other value.
    variants: [spindle-topology/1]

  - name: spindle.observe.Topology
    kind: struct
    naming:
      summary: >-
        The answer of `GET /__spindle/topology`: the graph of every specification the ingress
        serves, from the ingress down to the bindings, with the live numbers of each edge.
    fields:
      - name: format
        type: spindle.observe.TopologyFormat
      - name: at
        type: Timestamp
        summary: When the live numbers were read.
      - name: specifications
        type: List<String>
        summary: The system identifiers of the specifications served, in the order loaded.
      - name: nodes
        type: List<spindle.observe.TopologyNode>
      - name: edges
        type: List<spindle.observe.TopologyEdge>
