[package]
name = "spindle-telemetry"
description = "The Telemetry port: counters and histograms the runtime records for one instance, and the catalogue of them derived from the compiled IR."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["kernel"]
kernel = ["dep:spindle-kernel"]

[dependencies]
ess-compiler.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spindle-kernel = { path = "../spindle-kernel", default-features = false, optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[dev-dependencies]
schema-contract = { git = "https://github.com/beyond10x/ess", tag = "0.87.0" }
spindle-spec = { path = "../spindle-spec" }
tempfile = "3"
