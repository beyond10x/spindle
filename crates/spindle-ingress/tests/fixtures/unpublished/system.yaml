format: ess/34
system: helpdesk
version: v1
summary: A help desk that opens and touches tickets and publishes only the touch, which a log marks.
domains:
  - helpdesk.tickets
  - helpdesk.log
components:
  - component: desk
    summary: Opens and touches tickets for callers outside the process.
    owns:
      domains:
        - helpdesk.tickets
    accepts:
      commands:
        - helpdesk.tickets.OpenTicket
        - helpdesk.tickets.TouchTicket
    publishes:
      events:
        - helpdesk.tickets.Touched
    reached_by: network
  - component: log
    summary: Keeps one mark for every touch the desk publishes.
    owns:
      domains:
        - helpdesk.log
    accepts:
      commands:
        - helpdesk.log.RecordMark
    publishes:
      events:
        - helpdesk.log.Marked
    reached_by: network
bindings:
  - id: mark-on-touch
    when:
      event: helpdesk.tickets.Touched
    invoke:
      command: helpdesk.log.RecordMark
    mapping:
      ticket_id: event.ticket_id
    delivery: at_most_once
    on_failure: drop
