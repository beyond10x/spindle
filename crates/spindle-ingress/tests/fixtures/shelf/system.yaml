format: ess/34
system: library
version: v1
summary: Books shelved, lent and returned, read by id, by state and by year over the network.
domains:
  - library.shelf
components:
  - component: shelf
    summary: Shelves, lends and returns books, and answers what the shelf holds.
    owns:
      domains:
        - library.shelf
    accepts:
      commands:
        - library.shelf.ShelveBook
        - library.shelf.LendBook
    publishes:
      events:
        - library.shelf.BookShelved
        - library.shelf.BookLent
    reached_by: network
