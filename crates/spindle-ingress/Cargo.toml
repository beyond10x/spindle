[package]
name = "spindle-ingress"
description = "The HTTP adapter behind ingress.network: the components that require it, served on 127.0.0.1 at the routes ESS publishes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["listener"]
listener = ["dep:http-body-util", "dep:hyper", "dep:hyper-util", "dep:tokio"]

[dependencies]
ess-compiler.workspace = true
ess-gen.workspace = true
ess-http.workspace = true
ess-primitives.workspace = true
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1", features = ["http1", "server"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
serde_json.workspace = true
spindle-host = { path = "../spindle-host", default-features = false }
spindle-kernel = { path = "../spindle-kernel", default-features = false }
spindle-telemetry = { path = "../spindle-telemetry", default-features = false }
tokio = { version = "1", default-features = false, features = ["macros", "net", "rt", "sync", "time"], optional = true }

[dev-dependencies]
ess-conformance.workspace = true
jsonschema = { version = "0.52.1", default-features = false }
spindle-capability = { path = "../spindle-capability" }
spindle-host = { path = "../spindle-host" }
spindle-spec = { path = "../spindle-spec" }
tempfile = "3"
