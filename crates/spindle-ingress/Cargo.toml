[package]
name = "spindle-ingress"
description = "The HTTP adapter behind ingress.network: a component reached over the network, served on 127.0.0.1 at the routes ESS derives."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
ess-compiler.workspace = true
ess-gen.workspace = true
ess-http.workspace = true
serde_json.workspace = true
spindle-host = { path = "../spindle-host" }
spindle-kernel = { path = "../spindle-kernel" }
tokio = { version = "1", default-features = false, features = ["net", "rt", "sync"] }
