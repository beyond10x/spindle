domain: lamps.hall
summary: A caller installs lamps and adds crews; the system lights a lamp when it decides it is bright, and sends a free crew to a lamp unless the provider is out.
types:
  - name: lamps.hall.LampId
    kind: newtype
    of: String
  - name: lamps.hall.CrewId
    kind: newtype
    of: String
entities:
  - name: lamps.hall.Crew
    identity:
      name: crew_id
      type: lamps.hall.CrewId
    fields:
      - name: free
        type: Boolean
    lifecycle:
      initial: Ready
      states: [Ready]
      terminal: [Ready]
  - name: lamps.hall.Lamp
    identity:
      name: lamp_id
      type: lamps.hall.LampId
    fields:
      - name: crew
        type: Optional<lamps.hall.CrewId>
    relations:
      - name: crew
        kind: references
        target: lamps.hall.Crew
        cardinality: one
        via: crew
    lifecycle:
      initial: Dark
      states: [Dark, Lit, Served]
      terminal: [Lit, Served]
      transitions:
        - name: light
          from: [Dark]
          to: Lit
        - name: serve
          from: [Dark]
          to: Served
errors:
  - name: lamps.hall.Dim
    summary: The system decided the lamp is not bright.
    fields: []
  - name: lamps.hall.NoCrew
    summary: No crew carries the identity.
    fields: []
  - name: lamps.hall.CrewBusy
    summary: The crew is busy.
    fields: []
  - name: lamps.hall.Outage
    summary: The provider is out.
    fields: []
  - name: lamps.hall.LampStateConflict
    summary: The lamp is not dark.
    fields: []
  - name: lamps.hall.NoLamp
    summary: No lamp carries the identity.
    fields: []
events:
  - name: lamps.hall.Installed
    fields:
      - name: lamp_id
        type: lamps.hall.LampId
  - name: lamps.hall.CrewAdded
    fields:
      - name: crew_id
        type: lamps.hall.CrewId
  - name: lamps.hall.Lit
    fields:
      - name: lamp_id
        type: lamps.hall.LampId
  - name: lamps.hall.Dispatched
    fields:
      - name: lamp_id
        type: lamps.hall.LampId
      - name: crew
        type: lamps.hall.CrewId
views:
  - name: lamps.hall.Lamps
    source: lamps.hall.Lamp
    consistency: read_your_writes
    fields:
      - name: lamp_id
        type: lamps.hall.LampId
      - name: crew
        type: Optional<lamps.hall.CrewId>
      - name: state
        type: lamps.hall.Lamp.State
actors:
  - name: lamps.hall.Caller
    may: [lamps.hall.Install, lamps.hall.AddCrew]
  - name: lamps.hall.Lighter
    system: true
    may: [lamps.hall.Switch]
  - name: lamps.hall.Dispatcher
    system: true
    may: [lamps.hall.Dispatch]
commands:
  - name: lamps.hall.Install
    input:
      - name: lamp_id
        type: lamps.hall.LampId
    outcomes:
      - name: installed
        creates: lamps.hall.Lamp
        instance: lamp_id
        emits: [lamps.hall.Installed]
        payload:
          lamps.hall.Installed: {lamp_id: input.lamp_id}
        summary: The lamp is installed dark.
  - name: lamps.hall.AddCrew
    input:
      - name: crew_id
        type: lamps.hall.CrewId
      - name: free
        type: Boolean
    outcomes:
      - name: added
        creates: lamps.hall.Crew
        instance: crew_id
        sets:
          free: input.free
        emits: [lamps.hall.CrewAdded]
        payload:
          lamps.hall.CrewAdded: {crew_id: input.crew_id}
        summary: The crew is added, free or busy.
  - name: lamps.hall.Switch
    input:
      - name: lamp_id
        type: lamps.hall.LampId
      - name: bright
        type: Boolean
    outcomes:
      - name: lit
        when: bright == true
        moves: lamps.hall.Lamp.light
        instance: lamp_id
        emits: [lamps.hall.Lit]
        payload:
          lamps.hall.Lit: {lamp_id: input.lamp_id}
        summary: The system decided the lamp is bright and lit it.
      - name: dim
        error: lamps.hall.Dim
        summary: The system decided the lamp is not bright.
      - name: wrong-state
        wrong_state: true
        error: lamps.hall.LampStateConflict
        summary: The lamp is lit or served already.
      - name: no-lamp
        unknown_instance: true
        error: lamps.hall.NoLamp
        summary: No lamp carries the identity.
  - name: lamps.hall.Dispatch
    await_within: PT5S
    input:
      - name: lamp_id
        type: lamps.hall.LampId
      - name: crew
        type: lamps.hall.CrewId
    outcomes:
      - name: no-crew
        when_related: {via: input.crew, exists: false}
        error: lamps.hall.NoCrew
        summary: No crew carries the identity the system chose.
      - name: busy
        when_related: {via: input.crew, predicate: free == false}
        error: lamps.hall.CrewBusy
        summary: The crew the system chose is busy.
      - name: outage
        external: the provider may be out
        error: lamps.hall.Outage
        summary: The provider is out.
      - name: served
        moves: lamps.hall.Lamp.serve
        instance: lamp_id
        sets:
          crew: input.crew
        emits: [lamps.hall.Dispatched]
        payload:
          lamps.hall.Dispatched: {lamp_id: input.lamp_id, crew: input.crew}
        summary: A free crew is sent to the lamp.
      - name: wrong-state
        wrong_state: true
        error: lamps.hall.LampStateConflict
        summary: The lamp is lit or served already.
      - name: no-lamp
        unknown_instance: true
        error: lamps.hall.NoLamp
        summary: No lamp carries the identity.
