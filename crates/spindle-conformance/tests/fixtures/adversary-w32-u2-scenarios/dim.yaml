type: ess-scenario/1
domain: lamps.hall
scenario: the-system-leaves-a-dim-lamp-dark
summary: The system decides the lamp is not bright, so it never lights it, however often it is asked.
timeline:
  - at: 2026-01-05T09:00:00Z
    command: lamps.hall.Install
    actor: lamps.hall.Caller
    input: {lamp_id: lamp-1}
    outcome: installed
  - at: 2026-01-05T09:00:01Z
    command: lamps.hall.Switch
    input: {lamp_id: lamp-1}
    outcome: dim
assert:
  - view: lamps.hall.Lamps
    contains: {lamp_id: lamp-1, state: Dark}
