format: ess/34
system: shelf
version: v1
summary: Boxes packed with a list of labels.
domains:
  - shelf.box
components:
  - component: packer
    summary: Packs boxes.
    owns:
      domains:
        - shelf.box
    accepts:
      commands:
        - shelf.box.PackBox
    publishes:
      events:
        - shelf.box.BoxPacked
    reached_by: in_process
