domain: notes.pad
summary: Notes, each written once, read as a list.
types:
  - name: notes.pad.NoteId
    kind: newtype
    of: String
entities:
  - name: notes.pad.Note
    identity:
      name: note_id
      type: notes.pad.NoteId
    fields:
      - name: text
        type: String
    lifecycle:
      initial: Written
      states: [Written]
      terminal: [Written]
commands:
  - name: notes.pad.WriteNote
    input:
      - name: note_id
        type: notes.pad.NoteId
      - name: text
        type: String
    outcomes:
      - name: written
        creates: notes.pad.Note
        instance: note_id
        sets:
          text: input.text
        emits: [notes.pad.NoteWritten]
        payload:
          notes.pad.NoteWritten: {note_id: input.note_id}
        summary: The note is written.
events:
  - name: notes.pad.NoteWritten
    fields:
      - name: note_id
        type: notes.pad.NoteId
views:
  - name: notes.pad.AllNotes
    source: notes.pad.Note
    consistency: read_your_writes
    fields:
      - name: note_id
        type: notes.pad.NoteId
      - name: text
        type: String
