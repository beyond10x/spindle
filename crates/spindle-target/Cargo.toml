[package]
name = "spindle-target"
description = "The deployment target contract: the Launcher port, placement within a target's ceiling, and the process launcher."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "spindle-target-fixture"
path = "src/bin/spindle-target-fixture.rs"
test = false
doc = false
bench = false

[dependencies]
spindle-capability = { path = "../spindle-capability" }
rustix = { version = "1", features = ["process"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
ess-compiler.workspace = true
serde_json = "1"
spindle-spec = { path = "../spindle-spec" }
tempfile = "3"
