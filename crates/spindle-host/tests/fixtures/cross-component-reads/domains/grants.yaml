domain: access.grants
summary: Grants, each reading a field of a resource the catalogue owns as it is issued.
types:
  - name: access.grants.GrantId
    kind: newtype
    of: String
entities:
  - name: access.grants.Grant
    identity:
      name: grant_id
      type: access.grants.GrantId
    fields:
      - name: holder
        type: String
      - name: resource_id
        type: Optional<access.resources.ResourceId>
      - name: resource_name
        type: Optional<String>
    relations:
      - {name: resource, kind: references, target: access.resources.Resource, cardinality: one, via: resource_id}
    lifecycle:
      initial: Issued
      states: [Issued]
      terminal: [Issued]
commands:
  - name: access.grants.IssueGrant
    input:
      - name: grant_id
        type: access.grants.GrantId
      - name: holder
        type: String
      - name: name
        type: String
    outcomes:
      - name: issued
        creates: access.grants.Grant
        instance: grant_id
        sets:
          holder: input.holder
          resource_id: {related: {entity: access.resources.Resource, where: name == input.name, field: resource_id}}
        emits: [access.grants.GrantIssued]
        payload:
          access.grants.GrantIssued: {grant_id: input.grant_id}
        summary: The grant is kept on the resource its name selects.
  - name: access.grants.IssueNamedGrant
    input:
      - name: grant_id
        type: access.grants.GrantId
      - name: holder
        type: String
      - name: resource_id
        type: access.resources.ResourceId
    outcomes:
      - name: issued
        creates: access.grants.Grant
        instance: grant_id
        sets:
          holder: input.holder
          resource_id: input.resource_id
          resource_name: {related: {via: input.resource_id, field: name}}
        emits: [access.grants.GrantIssued]
        payload:
          access.grants.GrantIssued: {grant_id: input.grant_id}
        summary: The grant is kept with the name of the resource its input names.
  - name: access.grants.LabelGrantedResource
    input:
      - name: grant_id
        type: access.grants.GrantId
      - name: holder
        type: String
      - name: name
        type: String
      - name: label
        type: String
    outcomes:
      - name: labelled
        updates: access.grants.Grant
        instance: grant_id
        sets:
          holder: input.holder
        affects:
          - entity: access.resources.Resource
            where: name == input.name
            sets:
              label: input.label
        emits: [access.grants.ResourceLabelled]
        payload:
          access.grants.ResourceLabelled: {grant_id: input.grant_id}
        summary: The grant passes to a new holder, and the resource its name selects is labelled.
events:
  - name: access.grants.GrantIssued
    fields:
      - name: grant_id
        type: access.grants.GrantId
  - name: access.grants.ResourceLabelled
    fields:
      - name: grant_id
        type: access.grants.GrantId
views:
  - name: access.grants.Grants
    source: access.grants.Grant
    consistency: read_your_writes
    fields:
      - name: grant_id
        type: access.grants.GrantId
      - name: holder
        type: String
      - name: resource_id
        type: Optional<access.resources.ResourceId>
      - name: resource_name
        type: Optional<String>
