[package]
name = "spindle-wasm"
description = "Spindle in a Service Worker: a specification's routes and the console routes answered from the wasm host, its state in IndexedDB."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
ess-compiler.workspace = true
ess-gen.workspace = true
ess-http.workspace = true
js-sys = "0.3"
serde_json.workspace = true
spindle-capability = { path = "../spindle-capability" }
spindle-host = { path = "../spindle-host", default-features = false }
spindle-ingress = { path = "../spindle-ingress", default-features = false }
spindle-kernel = { path = "../spindle-kernel", default-features = false }
spindle-spec = { path = "../spindle-spec" }
spindle-store-browser = { path = "../spindle-store-browser" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Headers", "Request", "RequestInit", "Response", "ResponseInit", "Url"] }

[dev-dependencies]
serde_json.workspace = true
spindle-spec = { path = "../spindle-spec" }

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dev-dependencies]
spindle-capability = { path = "../spindle-capability" }
spindle-host = { path = "../spindle-host" }
spindle-ingress = { path = "../spindle-ingress" }
tempfile = "3"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = "0.3"
