domain: stock.items
summary: Items a command adds once per identity, answering a held identity with its declared duplicate.
entities:
  - name: stock.items.Item
    identity: {name: id, type: String}
    fields:
      - {name: label, type: String}
    lifecycle: {initial: Listed, states: [Listed], terminal: [Listed]}
errors:
  - name: stock.items.ItemExists
    summary: An item already carries the identity.
    fields:
      - {name: id, type: String}
events:
  - name: stock.items.ItemAdded
    fields: [{name: id, type: String}]
commands:
  - name: stock.items.AddItem
    input:
      - {name: id, type: String}
      - {name: label, type: String}
    outcomes:
      - name: duplicate
        existing_instance: true
        error: stock.items.ItemExists
        payload:
          stock.items.ItemExists: {id: input.id}
        summary: An item already carries the identity.
      - name: added
        creates: stock.items.Item
        instance: id
        sets: {label: input.label}
        emits: [stock.items.ItemAdded]
        payload:
          stock.items.ItemAdded: {id: input.id}
        summary: The item is added.
  - name: stock.items.AddCoded
    input:
      - {name: id, type: String}
      - {name: code, type: String}
      - {name: label, type: String}
      - {name: by_code, type: Boolean}
    outcomes:
      - name: duplicate
        existing_instance: true
        error: stock.items.ItemExists
        payload:
          stock.items.ItemExists: {id: input.id}
        summary: An item already carries the identity.
      - name: added-by-code
        when: by_code == true
        creates: stock.items.Item
        instance: id
        sets: {label: input.label}
        emits: [stock.items.ItemAdded]
        payload:
          stock.items.ItemAdded: {id: input.code}
        summary: The item is added under its code.
      - name: added
        creates: stock.items.Item
        instance: id
        sets: {label: input.label}
        emits: [stock.items.ItemAdded]
        payload:
          stock.items.ItemAdded: {id: input.id}
        summary: The item is added.
views:
  - name: stock.items.Items
    source: stock.items.Item
    consistency: read_your_writes
    fields:
      - {name: id, type: String}
      - {name: label, type: String}
      - {name: state, type: stock.items.Item.State}
