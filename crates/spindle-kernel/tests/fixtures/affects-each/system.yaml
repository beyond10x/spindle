format: ess/35
system: depot
version: v1
summary: Releases that record, retire and purge one row per element of an input list.
domains:
  - depot.release
components:
  - component: desk
    summary: Opens releases and writes the records, links and bins their lists name.
    owns:
      domains:
        - depot.release
    accepts:
      commands:
        - depot.release.OpenRelease
        - depot.release.AddRecord
        - depot.release.AddBin
        - depot.release.Publish
        - depot.release.PublishStable
        - depot.release.Retire
        - depot.release.Purge
        - depot.release.Link
        - depot.release.Fill
    publishes:
      events:
        - depot.release.ReleaseOpened
        - depot.release.RecordAdded
        - depot.release.BinAdded
        - depot.release.Published
        - depot.release.Retired
        - depot.release.Purged
        - depot.release.Linked
        - depot.release.Filled
    reached_by: in_process
