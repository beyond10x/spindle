domain: stock.items
summary: Items added once per identity, the identity read from a nested input or a flat one, which are retired and removed.
types:
  - name: stock.items.Wrap
    kind: struct
    fields:
      - {name: id, type: String}
entities:
  - name: stock.items.Item
    identity: {name: id, type: String}
    fields:
      - {name: label, type: String}
    lifecycle:
      initial: Listed
      states: [Listed, Retired]
      terminal: [Retired]
      transitions:
        - {name: retire, from: [Listed], to: Retired}
errors:
  - name: stock.items.ItemExists
    summary: An item already carries the identity.
    fields:
      - {name: id, type: String}
events:
  - name: stock.items.ItemAdded
    fields: [{name: id, type: String}]
  - name: stock.items.ItemRetired
    fields: [{name: id, type: String}]
  - name: stock.items.ItemRemoved
    fields: [{name: id, type: String}]
commands:
  - name: stock.items.AddItem
    input:
      - {name: id, type: String}
      - {name: label, type: String}
    outcomes:
      - name: duplicate
        existing_instance: true
        error: stock.items.ItemExists
        payload:
          stock.items.ItemExists: {id: input.id}
        summary: An item already carries the identity.
      - name: added
        creates: stock.items.Item
        instance: id
        sets: {label: input.label}
        emits: [stock.items.ItemAdded]
        payload:
          stock.items.ItemAdded: {id: input.id}
        summary: The item is added.
  - name: stock.items.AddWrapped
    input:
      - {name: wrap, type: stock.items.Wrap}
      - {name: label, type: String}
    outcomes:
      - name: duplicate
        existing_instance: true
        error: stock.items.ItemExists
        payload:
          stock.items.ItemExists: {id: input.wrap.id}
        summary: An item already carries the identity.
      - name: added
        creates: stock.items.Item
        instance: id
        sets: {label: input.label}
        emits: [stock.items.ItemAdded]
        payload:
          stock.items.ItemAdded: {id: input.wrap.id}
        summary: The item is added under the wrapped identity.
  - name: stock.items.RetireItem
    input:
      - {name: id, type: String}
    outcomes:
      - name: retired
        moves: stock.items.Item.retire
        instance: id
        emits: [stock.items.ItemRetired]
        payload:
          stock.items.ItemRetired: {id: input.id}
        summary: The item is retired.
  - name: stock.items.RemoveItem
    input:
      - {name: id, type: String}
    outcomes:
      - name: removed
        deletes: stock.items.Item
        instance: id
        emits: [stock.items.ItemRemoved]
        payload:
          stock.items.ItemRemoved: {id: input.id}
        summary: The item is removed.
views:
  - name: stock.items.Items
    source: stock.items.Item
    consistency: read_your_writes
    fields:
      - {name: id, type: String}
      - {name: label, type: String}
      - {name: state, type: stock.items.Item.State}
