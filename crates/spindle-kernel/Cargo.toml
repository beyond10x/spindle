[package]
name = "spindle-kernel"
description = "Execute ESS commands against the compiled model: select the outcome, apply its effect, emit its events."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ess-compiler.workspace = true
ess-domain.workspace = true
ess-primitives.workspace = true
eventlog-core = { git = "https://github.com/beyond10x/eventlog", tag = "0.9.2" }
eventlog-sqlite = { git = "https://github.com/beyond10x/eventlog", tag = "0.9.2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = "0.3"
tokio = { version = "1", default-features = false, features = ["rt"] }

[dev-dependencies]
spindle-spec = { path = "../spindle-spec" }
tempfile = "3"
