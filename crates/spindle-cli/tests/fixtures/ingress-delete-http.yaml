type: ess-http/1
specification:
  system: library
  version: v1
  source_digest: sha256:e431ab063a35e346a49761d535173644cbaad92d77aed3d072aa6678484fa719
routes:
  - command: library.shelf.ShelveBook
    method: post
    path: /books
    outcomes:
      shelved: {status: 201}
  - command: library.shelf.RemoveBook
    method: delete
    path: /books/{id}
    parameters: {id: input.id}
    outcomes:
      removed: {status: 200}
  - view: library.shelf.ShelvedBooks
    method: get
    path: /books
