format: ess/34
system: probe
version: v1
summary: Requests reached over the network that an approval desk outside the model approves or not.
domains:
  - probe.approval
components:
  - component: probe
    summary: Holds approved requests for callers outside the process.
    owns:
      domains:
        - probe.approval
    accepts:
      commands:
        - probe.approval.Ask
    publishes:
      events:
        - probe.approval.Approved
    reached_by: network
