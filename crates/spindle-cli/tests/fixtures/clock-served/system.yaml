format: ess/34
system: ledger
version: v1
summary: Slots booked over the network, early or late by the current time.
domains:
  - ledger.slot
components:
  - component: desk
    summary: Books slots for callers outside the process.
    owns:
      domains:
        - ledger.slot
    accepts:
      commands:
        - ledger.slot.Book
    publishes:
      events:
        - ledger.slot.BookedEarly
        - ledger.slot.BookedLate
    reached_by: network
