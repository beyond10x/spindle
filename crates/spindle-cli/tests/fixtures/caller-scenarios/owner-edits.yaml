type: ess-scenario/5
domain: quill.notebook
scenario: only-the-owner-edits-a-notebook
summary: A writer creates a notebook; another writer is refused its edit, and the owner retitles it.
timeline:
  - at: 2026-01-05T09:00:00Z
    command: quill.notebook.CreateNotebook
    actor: quill.notebook.Writer
    caller: {owner_id: 0f1e2d3c-4b5a-4968-8776-a5b4c3d2e1f0}
    input:
      notebook_id: 5b2d8f14-3c6a-4e7b-9d1f-2a3b4c5d6e7f
      title: field notes
    outcome: created
    events:
      - event: quill.notebook.NotebookCreated
        payload:
          notebook_id: 5b2d8f14-3c6a-4e7b-9d1f-2a3b4c5d6e7f
          owner_id: 0f1e2d3c-4b5a-4968-8776-a5b4c3d2e1f0
  - at: 2026-01-05T09:01:00Z
    command: quill.notebook.EditNotebook
    actor: quill.notebook.Writer
    caller: {owner_id: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d}
    input:
      notebook_id: 5b2d8f14-3c6a-4e7b-9d1f-2a3b4c5d6e7f
      title: stolen
    outcome: not-yours
    error: {name: quill.notebook.NotYours}
  - at: 2026-01-05T09:02:00Z
    command: quill.notebook.EditNotebook
    actor: quill.notebook.Writer
    caller: {owner_id: 0f1e2d3c-4b5a-4968-8776-a5b4c3d2e1f0}
    input:
      notebook_id: 5b2d8f14-3c6a-4e7b-9d1f-2a3b4c5d6e7f
      title: fair copy
    outcome: edited
assert:
  - view: quill.notebook.NotebookCard
    contains:
      notebook_id: 5b2d8f14-3c6a-4e7b-9d1f-2a3b4c5d6e7f
      owner_id: 0f1e2d3c-4b5a-4968-8776-a5b4c3d2e1f0
      title: fair copy
