domain: parcels.desk
summary: A parcel, registered under a minted id; the registration answers an id of its own.
entities:
  - name: parcels.desk.Parcel
    identity:
      name: id
      type: Uuid
    fields:
      - name: label
        type: String
    lifecycle:
      initial: Registered
      states: [Registered]
      terminal: [Registered]
commands:
  - name: parcels.desk.RegisterParcel
    input:
      - name: label
        type: String
    response:
      - name: id
        type: Uuid
    outcomes:
      - name: registered
        creates: parcels.desk.Parcel
        instance: id
        sets:
          label: input.label
        emits: [parcels.desk.ParcelRegistered]
        payload:
          parcels.desk.ParcelRegistered:
            id: {generated: true}
            label: input.label
        returns: true
        summary: The parcel is registered under a minted id; the answer returns an id read nowhere else.
events:
  - name: parcels.desk.ParcelRegistered
    fields:
      - name: id
        type: Uuid
      - name: label
        type: String
views:
  - name: parcels.desk.Parcels
    source: parcels.desk.Parcel
    consistency: read_your_writes
    fields:
      - name: id
        type: Uuid
      - name: label
        type: String
