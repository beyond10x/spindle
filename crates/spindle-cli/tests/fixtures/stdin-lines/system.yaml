format: ess/34
system: shelf
version: v1
summary: Books added under an identity the runtime mints, lent, returned, and withdrawn by the system's librarian.
domains:
  - shelf.books
components:
  - component: library
    summary: Holds the books.
    owns:
      domains:
        - shelf.books
    accepts:
      commands:
        - shelf.books.AddBook
        - shelf.books.LendBook
        - shelf.books.ReturnBook
        - shelf.books.Withdraw
    publishes:
      events:
        - shelf.books.BookAdded
        - shelf.books.BookLent
        - shelf.books.BookReturned
        - shelf.books.BookWithdrawn
    reached_by: in_process
domain: shelf.books
types:
  - name: shelf.books.BookId
    kind: newtype
    of: Uuid
actors:
  - name: shelf.books.Reader
    may:
      - shelf.books.AddBook
      - shelf.books.LendBook
      - shelf.books.ReturnBook
  - name: shelf.books.Librarian
    system: true
    may:
      - shelf.books.Withdraw
entities:
  - name: shelf.books.Book
    identity:
      name: book_id
      type: shelf.books.BookId
    fields:
      - name: title
        type: String
    lifecycle:
      initial: Shelved
      states: [Shelved, Lent, Withdrawn]
      terminal: [Withdrawn]
      transitions:
        - name: lend
          from: [Shelved]
          to: Lent
        - name: return
          from: [Lent]
          to: Shelved
        - name: withdraw
          from: [Shelved]
          to: Withdrawn
errors:
  - name: shelf.books.BookNotFound
    summary: No book carries the id.
    fields: []
  - name: shelf.books.AlreadyLent
    summary: The book is lent out.
    fields: []
  - name: shelf.books.NotLent
    summary: The book is on the shelf.
    fields: []
  - name: shelf.books.NotShelved
    summary: The book is not on the shelf.
    fields: []
commands:
  - name: shelf.books.AddBook
    input:
      - name: title
        type: String
    outcomes:
      - name: added
        creates: shelf.books.Book
        instance: book_id
        sets:
          title: input.title
        emits: [shelf.books.BookAdded]
        payload:
          shelf.books.BookAdded:
            book_id: {generated: true}
            title: input.title
        summary: The book is shelved under an identity the runtime mints.
  - name: shelf.books.LendBook
    input:
      - name: book_id
        type: shelf.books.BookId
    outcomes:
      - name: no-such-book
        unknown_instance: true
        error: shelf.books.BookNotFound
        summary: No book carries the id.
      - name: already-lent
        when_subject: {predicate: state == Lent}
        error: shelf.books.AlreadyLent
        summary: A lent book cannot be lent again.
      - name: lent
        moves: shelf.books.Book.lend
        instance: book_id
        emits: [shelf.books.BookLent]
        payload:
          shelf.books.BookLent: {book_id: input.book_id}
        summary: The book leaves the shelf.
  - name: shelf.books.ReturnBook
    input:
      - name: book_id
        type: shelf.books.BookId
    outcomes:
      - name: no-such-book
        unknown_instance: true
        error: shelf.books.BookNotFound
        summary: No book carries the id.
      - name: not-lent
        when_subject: {predicate: state == Shelved}
        error: shelf.books.NotLent
        summary: A shelved book cannot be returned.
      - name: returned
        moves: shelf.books.Book.return
        instance: book_id
        emits: [shelf.books.BookReturned]
        payload:
          shelf.books.BookReturned: {book_id: input.book_id}
        summary: The lent book is back on the shelf.
  - name: shelf.books.Withdraw
    input:
      - name: book_id
        type: shelf.books.BookId
    outcomes:
      - name: no-such-book
        unknown_instance: true
        error: shelf.books.BookNotFound
        summary: No book carries the id.
      - name: not-shelved
        when_subject: {predicate: state == Lent}
        error: shelf.books.NotShelved
        summary: A lent book is not withdrawn.
      - name: withdrawn
        moves: shelf.books.Book.withdraw
        instance: book_id
        emits: [shelf.books.BookWithdrawn]
        payload:
          shelf.books.BookWithdrawn: {book_id: input.book_id}
        summary: The librarian takes the book off the shelf for good.
events:
  - name: shelf.books.BookAdded
    fields:
      - name: book_id
        type: shelf.books.BookId
      - name: title
        type: String
  - name: shelf.books.BookLent
    fields:
      - name: book_id
        type: shelf.books.BookId
  - name: shelf.books.BookReturned
    fields:
      - name: book_id
        type: shelf.books.BookId
  - name: shelf.books.BookWithdrawn
    fields:
      - name: book_id
        type: shelf.books.BookId
