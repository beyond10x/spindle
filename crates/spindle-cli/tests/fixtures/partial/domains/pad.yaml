domain: notes.pad
summary: Notes written once, discarded, or copied with the copy's identity answered.
types:
  - name: notes.pad.NoteId
    kind: newtype
    of: String
entities:
  - name: notes.pad.Note
    identity:
      name: note_id
      type: notes.pad.NoteId
    fields:
      - name: text
        type: String
    lifecycle:
      initial: Kept
      states: [Kept]
      terminal: [Kept]
errors:
  - name: notes.pad.NoteNotFound
    summary: No note carries the id.
    fields: []
  - name: notes.pad.BodyMissing
    summary: The request carried no body.
    fields: []
commands:
  - name: notes.pad.WriteNote
    input:
      - name: note_id
        type: notes.pad.NoteId
      - name: text
        type: String
    outcomes:
      - name: written
        creates: notes.pad.Note
        instance: note_id
        sets:
          text: input.text
        emits: [notes.pad.NoteWritten]
        payload:
          notes.pad.NoteWritten: {note_id: input.note_id}
        summary: The note is kept.
  - name: notes.pad.DiscardNote
    input:
      - name: note_id
        type: notes.pad.NoteId
    outcomes:
      - name: body-missing
        input_absent: true
        error: notes.pad.BodyMissing
        summary: The request carried no body.
      - name: discarded
        deletes: notes.pad.Note
        instance: note_id
        emits: [notes.pad.NoteDiscarded]
        payload:
          notes.pad.NoteDiscarded: {note_id: input.note_id}
        summary: The note is gone.
  - name: notes.pad.CopyNote
    input:
      - name: note_id
        type: notes.pad.NoteId
      - name: text
        type: String
    response:
      - name: copy_id
        type: String
    outcomes:
      - name: copied
        creates: notes.pad.Note
        instance: note_id
        returns: true
        emits: [notes.pad.NoteCopied]
        payload:
          notes.pad.NoteCopied: {note_id: input.note_id, text: input.text}
        summary: The copy's identity is answered to the caller.
      - name: replayed
        when: text == "again"
        replays: copied
        summary: The earlier copy's answer is given again.
events:
  - name: notes.pad.NoteWritten
    fields:
      - name: note_id
        type: notes.pad.NoteId
  - name: notes.pad.NoteDiscarded
    fields:
      - name: note_id
        type: notes.pad.NoteId
  - name: notes.pad.NoteCopied
    fields:
      - name: note_id
        type: notes.pad.NoteId
      - name: text
        type: String
views:
  - name: notes.pad.AllNotes
    source: notes.pad.Note
    consistency: read_your_writes
    fields:
      - name: note_id
        type: notes.pad.NoteId
      - name: text
        type: String
