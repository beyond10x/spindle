domain: archive.shelf
summary: Books shelved under a title, with an optional note, resting shelved or lent.
entities:
  - name: archive.shelf.Book
    identity: {name: id, type: String}
    fields:
      - {name: title, type: String}
      - {name: note, type: Optional<String>}
    lifecycle:
      initial: Shelved
      states: [Shelved, Lent]
      terminal: [Lent]
      transitions:
        - {name: lend, from: [Shelved], to: Lent}
commands:
  - name: archive.shelf.ShelveBook
    input:
      - {name: id, type: String}
      - {name: title, type: String}
    outcomes:
      - name: shelved
        creates: archive.shelf.Book
        instance: id
        sets:
          title: input.title
        emits: [archive.shelf.BookShelved]
        payload:
          archive.shelf.BookShelved: {id: input.id}
        summary: The book is shelved without a note.
  - name: archive.shelf.LendBook
    input:
      - {name: id, type: String}
    outcomes:
      - name: lent
        moves: archive.shelf.Book.lend
        instance: id
        emits: [archive.shelf.BookLent]
        payload:
          archive.shelf.BookLent: {id: input.id}
        summary: The book is lent.
events:
  - name: archive.shelf.BookShelved
    fields:
      - {name: id, type: String}
  - name: archive.shelf.BookLent
    fields:
      - {name: id, type: String}
