domain: bay.lot
summary: Lots and their tags; closing a lot may sweep its tags, and a jammed sweeper refuses the close and jams the lot.
types:
  - name: bay.lot.LotId
    kind: newtype
    of: String
  - name: bay.lot.TagId
    kind: newtype
    of: String
  - name: bay.lot.Swept
    kind: struct
    fields:
      - name: tag_id
        type: bay.lot.TagId
entities:
  - name: bay.lot.Lot
    identity:
      name: lot_id
      type: bay.lot.LotId
    lifecycle:
      initial: Open
      states: [Open, Closed, Jammed]
      terminal: [Closed, Jammed]
      transitions:
        - name: close
          from: [Open]
          to: Closed
        - name: jam
          from: [Open]
          to: Jammed
  - name: bay.lot.Tag
    identity:
      name: tag_id
      type: bay.lot.TagId
    fields:
      - name: lot_id
        type: bay.lot.LotId
    lifecycle:
      initial: Live
      states: [Live, Swept]
      terminal: [Swept]
      transitions:
        - name: sweep
          from: [Live]
          to: Swept
errors:
  - name: bay.lot.LotClosedAlready
    summary: The lot is not open.
    fields: []
  - name: bay.lot.SweeperJammed
    summary: The sweeper jammed, and the lot is jammed with it.
    fields: []
  - name: bay.lot.TagSweptAlready
    summary: The tag is swept already.
    fields: []
commands:
  - name: bay.lot.OpenLot
    input:
      - name: lot_id
        type: bay.lot.LotId
    outcomes:
      - name: opened
        creates: bay.lot.Lot
        instance: lot_id
        emits: [bay.lot.LotOpened]
        payload:
          bay.lot.LotOpened: {lot_id: input.lot_id}
        summary: The lot is opened.
  - name: bay.lot.TagLot
    input:
      - name: tag_id
        type: bay.lot.TagId
      - name: lot_id
        type: bay.lot.LotId
    outcomes:
      - name: tagged
        creates: bay.lot.Tag
        instance: tag_id
        sets:
          lot_id: input.lot_id
        emits: [bay.lot.LotTagged]
        payload:
          bay.lot.LotTagged: {tag_id: input.tag_id}
        summary: The tag is put on the lot.
  - name: bay.lot.CloseLot
    input:
      - name: lot_id
        type: bay.lot.LotId
      - name: sweep
        type: Boolean
      - name: tags
        type: List<bay.lot.Swept>
    outcomes:
      - name: jammed
        external: the sweeper jams
        error: bay.lot.SweeperJammed
        compensates: true
        moves: bay.lot.Lot.jam
        instance: lot_id
        summary: The sweeper jams and refuses the close, and the lot is jammed, a compensating refusal the runtime does not run.
      - name: swept
        when:
          all:
            - sweep == true
            - distinct: {in: tags, as: swept, by: swept.tag_id}
        moves: bay.lot.Lot.close
        instance: lot_id
        emits: [bay.lot.LotClosed]
        payload:
          bay.lot.LotClosed: {lot_id: input.lot_id}
        affects:
          - entity: bay.lot.Tag
            each: {in: input.tags, as: swept}
            instance: swept.tag_id
            moves: bay.lot.Tag.sweep
        summary: The lot is closed and every held tag listed swept, a secondary effect over an input list.
      - name: closed
        moves: bay.lot.Lot.close
        instance: lot_id
        emits: [bay.lot.LotClosed]
        payload:
          bay.lot.LotClosed: {lot_id: input.lot_id}
        summary: The lot is closed and its tags kept.
      - name: wrong-state
        wrong_state: true
        error: bay.lot.LotClosedAlready
        summary: Only an open lot is closed.
  - name: bay.lot.SweepTag
    input:
      - name: tag_id
        type: bay.lot.TagId
    outcomes:
      - name: swept
        moves: bay.lot.Tag.sweep
        instance: tag_id
        emits: [bay.lot.TagSwept]
        payload:
          bay.lot.TagSwept: {tag_id: input.tag_id}
        summary: The tag is swept.
      - name: wrong-state
        wrong_state: true
        error: bay.lot.TagSweptAlready
        summary: Only a live tag is swept.
events:
  - name: bay.lot.LotOpened
    fields:
      - name: lot_id
        type: bay.lot.LotId
  - name: bay.lot.LotTagged
    fields:
      - name: tag_id
        type: bay.lot.TagId
  - name: bay.lot.LotClosed
    fields:
      - name: lot_id
        type: bay.lot.LotId
  - name: bay.lot.TagSwept
    fields:
      - name: tag_id
        type: bay.lot.TagId
