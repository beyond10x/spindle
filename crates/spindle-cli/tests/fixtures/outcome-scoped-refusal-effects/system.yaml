format: ess/34
system: bay
version: v1
summary: Lots tagged and closed in process, where closing a lot may sweep its tags and one way to close it is a compensating refusal this runtime does not run.
domains:
  - bay.lot
components:
  - component: bay
    summary: Opens, tags and closes lots.
    owns:
      domains:
        - bay.lot
    accepts:
      commands:
        - bay.lot.OpenLot
        - bay.lot.TagLot
        - bay.lot.CloseLot
        - bay.lot.SweepTag
    publishes:
      events:
        - bay.lot.LotOpened
        - bay.lot.LotTagged
        - bay.lot.LotClosed
        - bay.lot.TagSwept
    reached_by: in_process
