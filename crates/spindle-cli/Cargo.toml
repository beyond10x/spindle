[package]
name = "spindle-cli"
description = "b10x-spindle: check, derive capabilities for, admit, run and play an ESS specification."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "b10x-spindle"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
ess-compiler.workspace = true
ess-conformance.workspace = true
ess-domain.workspace = true
ess-primitives.workspace = true
serde.workspace = true
serde_json.workspace = true
spindle-capability.workspace = true
spindle-spec.workspace = true
spindle-kernel = { path = "../spindle-kernel" }
spindle-host = { path = "../spindle-host" }
spindle-telemetry = { path = "../spindle-telemetry" }
signal-hook = "0.3"
tempfile = "3"
toml.workspace = true

[dev-dependencies]
rustix = { version = "1", features = ["process"] }
