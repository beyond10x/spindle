[package]
name = "spindle-cli"
description = "b10x-spindle: check, derive capabilities for, admit, run and play an ESS specification."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "b10x-spindle"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap = { workspace = true, features = ["env"] }
ess-compiler.workspace = true
ess-conformance.workspace = true
ess-domain.workspace = true
ess-gen.workspace = true
ess-http.workspace = true
ess-primitives.workspace = true
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
serde.workspace = true
serde_json.workspace = true
spindle-capability.workspace = true
spindle-spec.workspace = true
spindle-kernel = { path = "../spindle-kernel" }
spindle-conformance = { path = "../spindle-conformance" }
spindle-control = { path = "../spindle-control" }
spindle-host = { path = "../spindle-host" }
spindle-ingress = { path = "../spindle-ingress" }
spindle-target = { path = "../spindle-target" }
spindle-telemetry = { path = "../spindle-telemetry" }
signal-hook = "0.3"
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["net", "rt", "time"] }
toml.workspace = true

[dev-dependencies]
serde_json = { workspace = true, features = ["raw_value"] }
jsonschema = { version = "0.52.1", default-features = false }
openmetrics-parser = "0.5"
rustix = { version = "1", features = ["process"] }
spindle-channel = { path = "../spindle-channel" }
spindle-observe-api = { path = "../spindle-observe-api", default-features = false }
