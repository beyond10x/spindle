name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
          components: rustfmt,clippy
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen-test-runner
        env:
          WASM_BINDGEN_VERSION: '0.2.130'
          WASM_BINDGEN_SHA256: 9687f3bb551b9f66f37ed32a40d7913a00f7962db653054e56857bc306c3227f
        run: |
          set -o pipefail
          archive="wasm-bindgen-$WASM_BINDGEN_VERSION-x86_64-unknown-linux-musl"
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/$archive.tar.gz" \
            "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$WASM_BINDGEN_VERSION/$archive.tar.gz"
          echo "$WASM_BINDGEN_SHA256  $RUNNER_TEMP/$archive.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive.tar.gz" -C "$RUNNER_TEMP"
          install -D -m 755 "$RUNNER_TEMP/$archive/wasm-bindgen-test-runner" "$RUNNER_TEMP/bin/wasm-bindgen-test-runner"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install go-task
        env:
          TASK_VERSION: '3.53.1'
          TASK_SHA256: a54a408f6861ff921f6e87774180db31bacd8c1e7c944ca696db9fea49a82fc7
        run: |
          set -o pipefail
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/task.tar.gz" \
            "https://github.com/go-task/task/releases/download/v$TASK_VERSION/task_linux_amd64.tar.gz"
          echo "$TASK_SHA256  $RUNNER_TEMP/task.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/task.tar.gz" -C "$RUNNER_TEMP/bin" task
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install aep
        env:
          AEP_VERSION: '0.79.0'
          AEP_SHA256: 7c54624685efa91065b8255311ad6d8af67c288021bcf44c0dc15da132000439
        run: |
          set -o pipefail
          archive="aep-$AEP_VERSION-x86_64-unknown-linux-gnu"
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/$archive.tar.gz" \
            "https://github.com/beyond10x/aep/releases/download/$AEP_VERSION/$archive.tar.gz"
          echo "$AEP_SHA256  $RUNNER_TEMP/$archive.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive.tar.gz" -C "$RUNNER_TEMP"
          install -D -m 755 "$RUNNER_TEMP/$archive/aep" "$RUNNER_TEMP/bin/aep"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install ess
        env:
          ESS_VERSION: '0.87.0'
          ESS_SHA256: b668a13e0a19a4d6c049499e2a2e3cd745e9454cf5e6dc2d0bcac4b156675cc6
        run: |
          set -o pipefail
          archive="ess-$ESS_VERSION-x86_64-unknown-linux-gnu"
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/$archive.tar.gz" \
            "https://github.com/beyond10x/ess/releases/download/$ESS_VERSION/$archive.tar.gz"
          echo "$ESS_SHA256  $RUNNER_TEMP/$archive.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive.tar.gz" -C "$RUNNER_TEMP"
          install -D -m 755 "$RUNNER_TEMP/$archive/ess" "$RUNNER_TEMP/bin/ess"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.9.0
          cache: true
          cache_dependency_path: ui/pnpm-lock.yaml

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Gate
        run: task check

