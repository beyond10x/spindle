name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
          components: rustfmt,clippy
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen and wasm-bindgen-test-runner
        env:
          WASM_BINDGEN_VERSION: '0.2.130'
          WASM_BINDGEN_SHA256: 9687f3bb551b9f66f37ed32a40d7913a00f7962db653054e56857bc306c3227f
        run: |
          set -o pipefail
          archive="wasm-bindgen-$WASM_BINDGEN_VERSION-x86_64-unknown-linux-musl"
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/$archive.tar.gz" \
            "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$WASM_BINDGEN_VERSION/$archive.tar.gz"
          echo "$WASM_BINDGEN_SHA256  $RUNNER_TEMP/$archive.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive.tar.gz" -C "$RUNNER_TEMP"
          install -D -m 755 "$RUNNER_TEMP/$archive/wasm-bindgen-test-runner" "$RUNNER_TEMP/bin/wasm-bindgen-test-runner"
          install -D -m 755 "$RUNNER_TEMP/$archive/wasm-bindgen" "$RUNNER_TEMP/bin/wasm-bindgen"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install go-task
        env:
          TASK_VERSION: '3.53.1'
          TASK_SHA256: a54a408f6861ff921f6e87774180db31bacd8c1e7c944ca696db9fea49a82fc7
        run: |
          set -o pipefail
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/task.tar.gz" \
            "https://github.com/go-task/task/releases/download/v$TASK_VERSION/task_linux_amd64.tar.gz"
          echo "$TASK_SHA256  $RUNNER_TEMP/task.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/task.tar.gz" -C "$RUNNER_TEMP/bin" task
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install aep
        env:
          AEP_VERSION: '0.79.0'
          AEP_SHA256: 7c54624685efa91065b8255311ad6d8af67c288021bcf44c0dc15da132000439
        run: |
          set -o pipefail
          archive="aep-$AEP_VERSION-x86_64-unknown-linux-gnu"
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/$archive.tar.gz" \
            "https://github.com/beyond10x/aep/releases/download/$AEP_VERSION/$archive.tar.gz"
          echo "$AEP_SHA256  $RUNNER_TEMP/$archive.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive.tar.gz" -C "$RUNNER_TEMP"
          install -D -m 755 "$RUNNER_TEMP/$archive/aep" "$RUNNER_TEMP/bin/aep"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install ess
        env:
          ESS_VERSION: '0.90.0'
          ESS_SHA256: 3a439345a9cf0debe7514dd9041768c88125679f2c1d6fc507a8921797a02a03
        run: |
          set -o pipefail
          archive="ess-$ESS_VERSION-x86_64-unknown-linux-gnu"
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/$archive.tar.gz" \
            "https://github.com/beyond10x/ess/releases/download/$ESS_VERSION/$archive.tar.gz"
          echo "$ESS_SHA256  $RUNNER_TEMP/$archive.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive.tar.gz" -C "$RUNNER_TEMP"
          install -D -m 755 "$RUNNER_TEMP/$archive/ess" "$RUNNER_TEMP/bin/ess"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.9.0
          cache: true
          cache_dependency_path: ui/pnpm-lock.yaml

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Gate
        run: task check

  postgres:
    name: PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'

      - name: Install go-task
        env:
          TASK_VERSION: '3.53.1'
          TASK_SHA256: a54a408f6861ff921f6e87774180db31bacd8c1e7c944ca696db9fea49a82fc7
        run: |
          set -o pipefail
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/task.tar.gz" \
            "https://github.com/go-task/task/releases/download/v$TASK_VERSION/task_linux_amd64.tar.gz"
          echo "$TASK_SHA256  $RUNNER_TEMP/task.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/task.tar.gz" -C "$RUNNER_TEMP/bin" task
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: PostgreSQL 17 on loopback, its TLS certificate issued by a CA of this run
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/postgres"
          mkdir -p "$dir"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=spindle-test-ca \
            -keyout "$dir/ca.key" -out "$dir/ca.pem" \
            -addext basicConstraints=critical,CA:TRUE -addext keyUsage=critical,keyCertSign,cRLSign
          openssl req -newkey rsa:2048 -nodes -subj /CN=localhost -keyout "$dir/server.key" -out "$dir/server.csr"
          printf 'subjectAltName=DNS:localhost,IP:127.0.0.1\nextendedKeyUsage=serverAuth\n' > "$dir/server.ext"
          openssl x509 -req -in "$dir/server.csr" -CA "$dir/ca.pem" -CAkey "$dir/ca.key" -CAcreateserial \
            -days 1 -extfile "$dir/server.ext" -out "$dir/server.pem"
          chmod 644 "$dir/server.key"
          docker run -d --name postgres -p 127.0.0.1:5432:5432 \
            -e POSTGRES_USER=owner -e POSTGRES_PASSWORD=owner -e POSTGRES_DB=spindle \
            -v "$dir:/certs:ro" --entrypoint sh postgres:17 -c \
            'install -o postgres -g postgres -m 600 /certs/server.key /tmp/server.key && install -o postgres -g postgres -m 644 /certs/server.pem /tmp/server.pem && exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/tmp/server.pem -c ssl_key_file=/tmp/server.key'
          for attempt in $(seq 1 60); do
            if docker exec postgres pg_isready -h 127.0.0.1 -U owner -d spindle >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec postgres pg_isready -h 127.0.0.1 -U owner -d spindle
          echo "SPINDLE_TEST_DATABASE_URL=postgres://owner:owner@127.0.0.1:5432/spindle" >> "$GITHUB_ENV"
          echo "SPINDLE_TEST_DATABASE_CA=$dir/ca.pem" >> "$GITHUB_ENV"

      - name: The PostgreSQL store
        run: task check:postgres

  macos:
    name: macOS
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: The workspace builds for aarch64-apple-darwin and x86_64-apple-darwin
        run: |
          set -euo pipefail
          cargo check --workspace --all-targets --locked --target aarch64-apple-darwin
          cargo check --workspace --all-targets --locked --target x86_64-apple-darwin

      - name: Clippy on macOS
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: The in-process test lanes
        run: |
          set -euo pipefail
          cargo test --locked --no-fail-fast -p spindle-spec -p spindle-capability -p spindle-kernel -p spindle-timer -p spindle-channel -p spindle-telemetry -p spindle-host -p spindle-conformance
          cargo test --locked --no-fail-fast -p spindle-cli --test spindle-cli -- admit:: conform:: run:: replay::
          cargo test --locked --no-fail-fast -p spindle-qemu --test spindle-qemu -- off_linux::
          cargo test --locked --no-fail-fast -p spindle-firecracker --test spindle-firecracker -- off_linux::

