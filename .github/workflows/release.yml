name: Release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag to backfill
        required: true
        type: string
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/release-linux-binary.sh
      - Containerfile

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  IMAGE: ghcr.io/beyond10x/spindle

jobs:
  provenance:
    name: Verify provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      containerfile: ${{ steps.image.outputs.containerfile }}
    steps:
      # A backfill is signed as release.yml@refs/heads/main and verified only at that ref, after
      # an upload that is never replaced; a dispatch from any other ref stops here, before
      # anything is built, signed or uploaded. A tag push and a pull request pass.
      - name: A backfill runs the workflow from main
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "A backfill runs release.yml from refs/heads/main, the ref its signatures name; this one runs from '$GITHUB_REF'. Nothing built, signed or uploaded." | tee -a "$GITHUB_STEP_SUMMARY" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'

      - id: release
        name: Tag, workspace version, changelog and main agree
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "spindle-cli") | .version')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [ "$EVENT" = pull_request ]; then
            echo "Pull request run: no tag provenance; building workspace version $version, publishing nothing." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "tag=" >> "$GITHUB_OUTPUT"
          else
            [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            test "$(git cat-file -t "refs/tags/${TAG}")" = tag
            test "$(git rev-parse HEAD)" = "$(git rev-parse "${TAG}^{commit}")"
            git merge-base --is-ancestor HEAD origin/main
            test "$TAG" = "$version"
            grep -Eq "^## \[${version//./\\.}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Only a version cut before the image existed (older than 0.26.0) may lack the Containerfile:
      # its backfill builds no image and publishes the rest without IMAGES. From 0.26.0 on, a commit
      # without one at the repository root fails here.
      - id: image
        name: Whether the commit builds an image
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          if [ -f Containerfile ]; then
            echo "containerfile=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "No version to compare with 0.26.0: '$VERSION'." >&2; exit 1; }
          if [ "$(printf '%s\n%s\n' "$VERSION" 0.26.0 | sort -V | head -n 1)" = 0.26.0 ]; then
            echo "The commit of $VERSION has no Containerfile at the repository root; every release from 0.26.0 on publishes its image from it." | tee -a "$GITHUB_STEP_SUMMARY" >&2
            exit 1
          fi
          echo "containerfile=false" >> "$GITHUB_OUTPUT"
          echo "The commit of $VERSION, older than 0.26.0, has no Containerfile: no image is built and the release carries no IMAGES." | tee -a "$GITHUB_STEP_SUMMARY"

  gate:
    name: Gate green on the tagged commit
    if: ${{ github.event_name != 'pull_request' }}
    needs: provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      COMMIT: ${{ needs.provenance.outputs.commit }}
    steps:
      - name: Wait for the CI gate and the macOS job of the commit
        run: |
          set -euo pipefail
          for check in Gate macOS; do
            green=0
            for attempt in $(seq 1 80); do
              runs="$(gh api "repos/${GH_REPO}/commits/${COMMIT}/check-runs?check_name=${check}&filter=latest" --jq '[.check_runs[] | {status, conclusion}]')"
              if [ "$(jq 'length' <<< "$runs")" -gt 0 ] && [ "$(jq '[.[] | select(.status != "completed")] | length' <<< "$runs")" -eq 0 ]; then
                if [ "$(jq '[.[] | select(.conclusion != "success")] | length' <<< "$runs")" -eq 0 ]; then
                  echo "CI check $check green on $COMMIT after $attempt check(s)." | tee -a "$GITHUB_STEP_SUMMARY"
                  green=1
                  break
                fi
                echo "CI check $check on $COMMIT did not succeed: $runs" | tee -a "$GITHUB_STEP_SUMMARY"
                exit 1
              fi
              sleep 30
            done
            if [ "$green" -ne 1 ]; then
              echo "No completed CI check $check on $COMMIT after 40 minutes; nothing published." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          done

  ui:
    name: Build the observe UI
    needs: provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.provenance.outputs.commit }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.9.0

      - name: Build ui/dist
        working-directory: ui
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm build
          pnpm build:panel
          test -s dist/index.html
          test -s dist-panel/panel.html

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-dist
          path: ui/dist
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-panel
          path: ui/dist-panel
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build ${{ matrix.target }}
    needs: [provenance, ui]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            cargo-auditable-sha256: 4c8d3b08c3c34e9f2333367224dbbfb4aab68067698b43de59fe19aded3416dd
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            cargo-auditable-sha256: bcb2d46002a8dd8e94d0d669cb39d38c9651db2ae5d1f3f1f1bab516ee1e212c
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            cargo-auditable-host: x86_64-unknown-linux-gnu
            cargo-auditable-sha256: 4c8d3b08c3c34e9f2333367224dbbfb4aab68067698b43de59fe19aded3416dd
          - target: aarch64-apple-darwin
            os: macos-15
            cargo-auditable-sha256: a66ad6392861ca1abfe0b02b522622d91edf63e5d7b60f4d3088b5c23d240c72
          - target: x86_64-apple-darwin
            os: macos-15-intel
            cargo-auditable-sha256: 4b87f06ea13d32466bbc68b1f5715ac11753a052d9935245380bddce8a3f0e50
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.provenance.outputs.version }}
      CARGO_AUDITABLE_VERSION: '0.7.7'
      RUST_AUDIT_INFO_VERSION: '0.5.4'
      GLIBC_FLOOR: '2.17'
      GLIBC_IMAGE: debian:bookworm@sha256:1d04200c2ece1d4d75a2a6f8e11ebce7d86a2ae28b34bb2c9cbb3ee9f4953e75
      MUSL_IMAGE: alpine:3.24.4@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.provenance.outputs.commit }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'
          targets: ${{ matrix.target }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ui-dist
          path: ui/dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ui-panel
          path: ui/dist-panel

      - name: Install cargo-auditable and rust-audit-info
        shell: bash
        env:
          CARGO_AUDITABLE_HOST: ${{ matrix.cargo-auditable-host || matrix.target }}
          CARGO_AUDITABLE_SHA256: ${{ matrix.cargo-auditable-sha256 }}
        run: |
          set -euo pipefail
          archive="cargo-auditable-${CARGO_AUDITABLE_HOST}"
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/$archive.tar.xz" \
            "https://github.com/rust-secure-code/cargo-auditable/releases/download/v${CARGO_AUDITABLE_VERSION}/$archive.tar.xz"
          echo "$CARGO_AUDITABLE_SHA256  $RUNNER_TEMP/$archive.tar.xz" | shasum -a 256 --check --strict
          tar -xJf "$RUNNER_TEMP/$archive.tar.xz" -C "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 755 "$RUNNER_TEMP/$archive/cargo-auditable" "$RUNNER_TEMP/bin/cargo-auditable"
          cargo install --locked --version "$RUST_AUDIT_INFO_VERSION" --root "$RUNNER_TEMP" rust-audit-info
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install zig and cargo-zigbuild
        if: ${{ contains(matrix.target, '-unknown-linux-') }}
        shell: bash
        env:
          ZIG_VERSION: '0.15.2'
          CARGO_ZIGBUILD_VERSION: '0.24.1'
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)
              arch=x86_64
              zig_sha256=02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239
              zigbuild_sha256=32581c8e13f27a807bb244aaaac870522f5b51263c766cf77b1a99771ce9fa5c
              ;;
            aarch64)
              arch=aarch64
              zig_sha256=958ed7d1e00d0ea76590d27666efbf7a932281b3d7ba0c6b01b0ff26498f667f
              zigbuild_sha256=70bb4c9cc71a6d16211b9079996e3cd588671053312adeff4d043499ed887601
              ;;
            *)
              echo "No pinned zig for $(uname -m)." >&2
              exit 1
              ;;
          esac
          zig="zig-${arch}-linux-${ZIG_VERSION}"
          zigbuild="cargo-zigbuild-${arch}-unknown-linux-gnu"
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/$zig.tar.xz" \
            "https://ziglang.org/download/${ZIG_VERSION}/$zig.tar.xz"
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/$zigbuild.tar.xz" \
            "https://github.com/rust-cross/cargo-zigbuild/releases/download/v${CARGO_ZIGBUILD_VERSION}/$zigbuild.tar.xz"
          printf '%s  %s\n' "$zig_sha256" "$RUNNER_TEMP/$zig.tar.xz" "$zigbuild_sha256" "$RUNNER_TEMP/$zigbuild.tar.xz" \
            | sha256sum --check --strict
          tar -xJf "$RUNNER_TEMP/$zig.tar.xz" -C "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/zigbuild" "$RUNNER_TEMP/bin"
          tar -xJf "$RUNNER_TEMP/$zigbuild.tar.xz" -C "$RUNNER_TEMP/zigbuild"
          found="$(find "$RUNNER_TEMP/zigbuild" -type f -name cargo-zigbuild | head -n 1)"
          test -n "$found" || { echo "No cargo-zigbuild in $zigbuild.tar.xz." >&2; exit 1; }
          install -m 755 "$found" "$RUNNER_TEMP/bin/cargo-zigbuild"
          echo "$RUNNER_TEMP/$zig" >> "$GITHUB_PATH"

      - name: Build b10x-spindle with the UI embedded and its dependency list
        shell: bash
        run: |
          set -euo pipefail
          test -s ui/dist/index.html
          test -s ui/dist-panel/panel.html
          if ! command -v cargo-auditable >/dev/null; then
            echo "cargo-auditable is missing: the binary would carry no dependency list." >&2
            exit 1
          fi
          # A gnu binary links against the glibc floor and a musl binary links statically, both
          # through cargo-zigbuild; the output lands in target/<target>/release either way.
          subcommand=build
          triple="$TARGET"
          case "$TARGET" in
            *-unknown-linux-gnu) subcommand=zigbuild; triple="${TARGET}.${GLIBC_FLOOR}" ;;
            *-unknown-linux-musl) subcommand=zigbuild ;;
          esac
          cargo auditable "$subcommand" --locked --release -p spindle-cli --target "$triple" 2>&1 | tee "$RUNNER_TEMP/build.log"
          if grep -Fq "ui/dist is missing" "$RUNNER_TEMP/build.log"; then
            echo "The build embedded no UI." >&2
            exit 1
          fi
          if grep -Fq "ui/dist-panel/panel.html is missing" "$RUNNER_TEMP/build.log"; then
            echo "The build embedded no observe panel." >&2
            exit 1
          fi

      - name: The binary names the version
        shell: bash
        run: |
          set -euo pipefail
          test "$("target/${TARGET}/release/b10x-spindle" --version)" = "b10x-spindle ${VERSION}"

      # The runner's own ls needs a newer glibc and is dynamic, so each check must refuse it
      # before its pass on the release binary counts.
      - name: The gnu binary needs glibc 2.17 at most and runs on Debian bookworm
        if: ${{ endsWith(matrix.target, '-unknown-linux-gnu') }}
        shell: bash
        run: |
          set -euo pipefail
          if sh scripts/release-linux-binary.sh glibc-floor /usr/bin/ls "$GLIBC_FLOOR" > /dev/null 2>&1; then
            echo "The glibc floor check passed the runner's ls, which needs a newer glibc." >&2
            exit 1
          fi
          bin="target/${TARGET}/release/b10x-spindle"
          sh scripts/release-linux-binary.sh glibc-floor "$bin" "$GLIBC_FLOOR" | tee -a "$GITHUB_STEP_SUMMARY"
          sh scripts/release-linux-binary.sh runs-in "$GLIBC_IMAGE" "$bin" "b10x-spindle ${VERSION}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: The musl binary is static and runs on Alpine
        if: ${{ endsWith(matrix.target, '-unknown-linux-musl') }}
        shell: bash
        run: |
          set -euo pipefail
          if sh scripts/release-linux-binary.sh static /usr/bin/ls > /dev/null 2>&1; then
            echo "The static check passed the runner's ls, which is dynamic." >&2
            exit 1
          fi
          bin="target/${TARGET}/release/b10x-spindle"
          sh scripts/release-linux-binary.sh static "$bin" | tee -a "$GITHUB_STEP_SUMMARY"
          sh scripts/release-linux-binary.sh runs-in "$MUSL_IMAGE" "$bin" "b10x-spindle ${VERSION}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: The binary carries its dependency list
        shell: bash
        env:
          LC_ALL: C
        run: |
          set -euo pipefail
          rust-audit-info "target/${TARGET}/release/b10x-spindle" > "$RUNNER_TEMP/audit.json"
          jq -r '.packages[].name' "$RUNNER_TEMP/audit.json" | sort -u > "$RUNNER_TEMP/embedded.txt"
          cargo tree --locked -p spindle-cli --target "$TARGET" -e normal --prefix none --format '{p}' \
            | awk 'NF { print $1 }' | sort -u > "$RUNNER_TEMP/expected.txt"
          cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[].name' | sort -u > "$RUNNER_TEMP/members.txt"
          comm -12 "$RUNNER_TEMP/members.txt" "$RUNNER_TEMP/expected.txt" > "$RUNNER_TEMP/workspace.txt"
          missing="$(comm -23 "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/embedded.txt")"
          if [ -n "$missing" ]; then
            echo "The binary's dependency list lacks: $(tr '\n' ' ' <<< "$missing")" >&2
            exit 1
          fi
          for crate in spindle-cli spindle-kernel eventlog-postgres; do
            grep -Fxq "$crate" "$RUNNER_TEMP/embedded.txt" || { echo "The binary's dependency list lacks $crate." >&2; exit 1; }
          done
          echo "${TARGET}: the binary lists $(wc -l < "$RUNNER_TEMP/embedded.txt" | tr -d ' ') crates, $(wc -l < "$RUNNER_TEMP/workspace.txt" | tr -d ' ') of them workspace crates ($(tr '\n' ' ' < "$RUNNER_TEMP/workspace.txt")), and eventlog-postgres." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Package
        shell: bash
        env:
          COPYFILE_DISABLE: "1"
        run: |
          set -euo pipefail
          name="b10x-spindle-${VERSION}-${TARGET}"
          mkdir -p "dist/${name}"
          cp LICENSE README.md CHANGELOG.md "dist/${name}/"
          cp "target/${TARGET}/release/b10x-spindle" "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          rm -r "dist/${name}"
          test -s "dist/${name}.tar.gz"
          tar -tzf "dist/${name}.tar.gz" > "dist/${name}.list"
          grep -Fxq "${name}/b10x-spindle" "dist/${name}.list"
          rm "dist/${name}.list"
          (cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256")
          test -s "dist/${name}.tar.gz.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: b10x-spindle-${{ needs.provenance.outputs.version }}-${{ matrix.target }}.tar.gz
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  sbom:
    name: CycloneDX SBOM
    needs: provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.provenance.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.provenance.outputs.commit }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.1'

      - name: Install cargo-cyclonedx
        env:
          CARGO_CYCLONEDX_VERSION: '0.5.9'
          CARGO_CYCLONEDX_SHA256: fb8dbee9f182173e062a64a387b21a0badc6fab8b2abf9294973f012972bf6d8
        run: |
          set -euo pipefail
          archive="cargo-cyclonedx-x86_64-unknown-linux-gnu"
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/$archive.tar.xz" \
            "https://github.com/CycloneDX/cyclonedx-rust-cargo/releases/download/cargo-cyclonedx-${CARGO_CYCLONEDX_VERSION}/$archive.tar.xz"
          echo "$CARGO_CYCLONEDX_SHA256  $RUNNER_TEMP/$archive.tar.xz" | sha256sum --check --strict
          tar -xJf "$RUNNER_TEMP/$archive.tar.xz" -C "$RUNNER_TEMP"
          install -D -m 755 "$RUNNER_TEMP/$archive/cargo-cyclonedx" "$RUNNER_TEMP/bin/cargo-cyclonedx"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: One SBOM for the five release targets
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          targets="x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-unknown-linux-musl aarch64-apple-darwin x86_64-apple-darwin"
          mkdir -p "$RUNNER_TEMP/sbom" dist
          for target in $targets; do
            cargo cyclonedx --quiet --manifest-path crates/spindle-cli/Cargo.toml --format json --spec-version 1.5 \
              --target "$target" --override-filename "sbom-${target}"
            mv "crates/spindle-cli/sbom-${target}.json" "$RUNNER_TEMP/sbom/"
          done
          git diff --exit-code -- Cargo.lock
          sbom="dist/b10x-spindle-${VERSION}.cdx.json"
          jq -s '
            . as $boms
            | $boms[0]
            | .metadata.properties = ([$boms[].metadata.properties[]?] | unique)
            | .components = ([$boms[].components[]] | unique_by(."bom-ref"))
            | .dependencies = ([$boms[].dependencies[]] | group_by(.ref)
                | map({ref: .[0].ref, dependsOn: ([.[].dependsOn[]?] | unique)}))
          ' $(for target in $targets; do printf '%s ' "$RUNNER_TEMP/sbom/sbom-${target}.json"; done) > "$sbom"
          if ! jq -e --arg version "$VERSION" '
            .bomFormat == "CycloneDX"
            and .metadata.component.name == "spindle-cli"
            and .metadata.component.version == $version
            and ([.metadata.properties[] | select(.name == "cdx:rustc:sbom:target:triple")] | length) == 5
            and ([.components[].name] | index("eventlog-postgres")) != null
          ' "$sbom" > /dev/null; then
            echo "The SBOM is not CycloneDX for spindle-cli $VERSION on the five targets with eventlog-postgres." >&2
            exit 1
          fi
          echo "SBOM $(basename "$sbom"): $(jq '.components | length' "$sbom") components for $(wc -w <<< "$targets") targets." | tee -a "$GITHUB_STEP_SUMMARY"
          (cd dist && sha256sum "$(basename "$sbom")" > "$(basename "$sbom").sha256")

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: |
            dist/*.cdx.json
            dist/*.cdx.json.sha256
          if-no-files-found: error
          retention-days: 7

  # One image per gnu build row, on a runner of its architecture: built from the binary the build
  # job checked, then checked (version, user, an answer from outside the container). This job
  # holds no package scope; a pull request builds and checks both images and pushes nothing.
  image:
    name: Image ${{ matrix.platform }}
    if: ${{ !cancelled() && needs.provenance.outputs.containerfile == 'true' && needs.build.result == 'success' && (needs.gate.result == 'success' || (github.event_name == 'pull_request' && needs.gate.result == 'skipped')) }}
    needs: [provenance, gate, build]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            platform: linux/amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            platform: linux/arm64
    env:
      TARGET: ${{ matrix.target }}
      PLATFORM: ${{ matrix.platform }}
      VERSION: ${{ needs.provenance.outputs.version }}
      CHECKED: spindle-check:${{ matrix.target }}
      BUILDKIT_IMAGE: moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      ROOT_IMAGE: debian:bookworm@sha256:1d04200c2ece1d4d75a2a6f8e11ebce7d86a2ae28b34bb2c9cbb3ee9f4953e75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.provenance.outputs.commit }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: b10x-spindle-${{ needs.provenance.outputs.version }}-${{ matrix.target }}.tar.gz
          path: dist

      - name: Unpack the binary the build job checked
        run: |
          set -euo pipefail
          name="b10x-spindle-${VERSION}-${TARGET}"
          (cd dist && sha256sum --check --strict "${name}.tar.gz.sha256")
          tar -xzf "dist/${name}.tar.gz" -C "$RUNNER_TEMP" "${name}/b10x-spindle"
          mkdir -p "$RUNNER_TEMP/context"
          mv "$RUNNER_TEMP/${name}/b10x-spindle" "$RUNNER_TEMP/context/b10x-spindle"
          test "$("$RUNNER_TEMP/context/b10x-spindle" --version)" = "b10x-spindle ${VERSION}"

      - name: The Containerfile pins its base, copies only and runs as a numeric user other than 0
        run: |
          set -euo pipefail
          sh scripts/release-linux-binary.sh containerfile Containerfile | tee -a "$GITHUB_STEP_SUMMARY"

      # Reproducible: the commit's time as SOURCE_DATE_EPOCH and every file time rewritten to it, so
      # image-push can rebuild this image byte for byte and prove it did.
      - name: Build the image and load it
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          docker buildx create --name spindle-image --driver docker-container --driver-opt "image=${BUILDKIT_IMAGE}"
          docker buildx build --builder spindle-image --platform "$PLATFORM" --provenance=false --sbom=false \
            --file Containerfile --output "type=docker,name=${CHECKED},rewrite-timestamp=true" "$RUNNER_TEMP/context"

      # Debian answers no --version and runs as root, so each check must refuse it before its pass
      # on the image counts.
      - name: The image answers the release's version and runs as a user other than root
        run: |
          set -euo pipefail
          docker pull --quiet "$ROOT_IMAGE" > /dev/null
          if sh scripts/release-linux-binary.sh image-version "$ROOT_IMAGE" "b10x-spindle ${VERSION}" > /dev/null 2>&1; then
            echo "The version check passed $ROOT_IMAGE, which holds no b10x-spindle." >&2
            exit 1
          fi
          if sh scripts/release-linux-binary.sh image-user "$ROOT_IMAGE" > /dev/null 2>&1; then
            echo "The user check passed $ROOT_IMAGE, which runs as root." >&2
            exit 1
          fi
          sh scripts/release-linux-binary.sh image-version "$CHECKED" "b10x-spindle ${VERSION}" | tee -a "$GITHUB_STEP_SUMMARY"
          sh scripts/release-linux-binary.sh image-user "$CHECKED" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: run in the image answers a request from outside the container
        run: |
          set -euo pipefail
          sh scripts/release-linux-binary.sh image-answers "$CHECKED" examples/rally/ess examples/environments/laptop.toml \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Record the checked image's ID
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/checked"
          docker image inspect --format '{{.Id}}' "$CHECKED" > "$RUNNER_TEMP/checked/${TARGET}"
          echo "${PLATFORM}: checked image $(cat "$RUNNER_TEMP/checked/${TARGET}")." | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ github.event_name != 'pull_request' }}
        with:
          name: image-checked-${{ matrix.target }}
          path: ${{ runner.temp }}/checked/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7

  # With image-manifest, the only job that may write packages, and it runs on no pull request. It
  # rebuilds the image the image job checked, refuses a rebuild whose ID differs, and pushes that
  # build by digest, untagged.
  image-push:
    name: Push image ${{ matrix.platform }} by digest
    if: ${{ github.event_name != 'pull_request' && needs.provenance.outputs.containerfile == 'true' }}
    needs: [provenance, gate, image]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            platform: linux/amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            platform: linux/arm64
    env:
      TARGET: ${{ matrix.target }}
      PLATFORM: ${{ matrix.platform }}
      VERSION: ${{ needs.provenance.outputs.version }}
      REBUILT: spindle-push:${{ matrix.target }}
      BUILDKIT_IMAGE: moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.provenance.outputs.commit }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: b10x-spindle-${{ needs.provenance.outputs.version }}-${{ matrix.target }}.tar.gz
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: image-checked-${{ matrix.target }}
          path: checked

      - name: Unpack the binary the build job checked
        run: |
          set -euo pipefail
          name="b10x-spindle-${VERSION}-${TARGET}"
          (cd dist && sha256sum --check --strict "${name}.tar.gz.sha256")
          tar -xzf "dist/${name}.tar.gz" -C "$RUNNER_TEMP" "${name}/b10x-spindle"
          mkdir -p "$RUNNER_TEMP/context"
          mv "$RUNNER_TEMP/${name}/b10x-spindle" "$RUNNER_TEMP/context/b10x-spindle"

      - name: Rebuild the image and refuse it unless it is the checked one
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"
          docker buildx create --name spindle-image --driver docker-container --driver-opt "image=${BUILDKIT_IMAGE}"
          docker buildx build --builder spindle-image --platform "$PLATFORM" --provenance=false --sbom=false \
            --file Containerfile --output "type=docker,name=${REBUILT},rewrite-timestamp=true" "$RUNNER_TEMP/context"
          checked="$(cat "checked/${TARGET}")"
          rebuilt="$(docker image inspect --format '{{.Id}}' "$REBUILT")"
          [[ "$checked" =~ ^sha256:[0-9a-f]{64}$ ]]
          if [ "$rebuilt" != "$checked" ]; then
            echo "${PLATFORM}: the rebuilt image ${rebuilt} is not the checked image ${checked}; nothing pushed." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "checked=$checked" >> "$GITHUB_ENV"

      - name: Log in to ghcr.io
        if: ${{ github.event_name != 'pull_request' }}
        env:
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin

      # The same build again, from this builder's cache at the same SOURCE_DATE_EPOCH, pushed by
      # digest with no tag; it must still be the checked image.
      - name: Push the checked image by digest
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail
          docker buildx build --builder spindle-image --platform "$PLATFORM" --provenance=false --sbom=false \
            --file Containerfile --metadata-file "$RUNNER_TEMP/pushed.json" \
            --output "type=image,name=${IMAGE},push-by-digest=true,name-canonical=true,push=true,rewrite-timestamp=true" \
            "$RUNNER_TEMP/context"
          pushed="$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/pushed.json")"
          config="$(jq -r '."containerimage.config.digest"' "$RUNNER_TEMP/pushed.json")"
          [[ "$pushed" =~ ^sha256:[0-9a-f]{64}$ ]]
          if [ "$checked" != "$config" ] && [ "$checked" != "$pushed" ]; then
            echo "The pushed image ${IMAGE}@${pushed} (config ${config}) is not the checked image ${checked}." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' "$pushed" > "$RUNNER_TEMP/digests/${TARGET}"
          echo "${PLATFORM}: pushed ${IMAGE}@${pushed}, the checked image, untagged." | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ github.event_name != 'pull_request' }}
        with:
          name: image-digest-${{ matrix.target }}
          path: ${{ runner.temp }}/digests/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7

  # The manifest list of the two checked images, tagged <version> once. A tag already in ghcr.io
  # that lists exactly these two images is a re-run or backfill and is left as it is; one listing
  # anything else is refused, never moved, and so is a tag ghcr.io cannot say it lacks. The list's
  # digest becomes the IMAGES asset, and the list is signed by that digest with cosign (keyless,
  # this workflow's identity), never by its tag.
  image-manifest:
    name: Tag and sign the image's manifest list
    if: ${{ github.event_name != 'pull_request' && needs.provenance.outputs.containerfile == 'true' }}
    needs: [provenance, gate, image-push]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      VERSION: ${{ needs.provenance.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.provenance.outputs.commit }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: digests
          pattern: image-digest-*
          merge-multiple: true

      - name: Log in to ghcr.io
        if: ${{ github.event_name != 'pull_request' }}
        env:
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin

      - name: Tag the manifest list of both architectures and write IMAGES
        run: |
          set -euo pipefail
          found=(digests/*)
          test "${#found[@]}" -eq 2
          amd64="$(cat digests/x86_64-unknown-linux-gnu)"
          arm64="$(cat digests/aarch64-unknown-linux-gnu)"
          [[ "$amd64" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$arm64" =~ ^sha256:[0-9a-f]{64}$ ]]
          if inspected="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" 2>&1)"; then
            held="sha256:$(docker buildx imagetools inspect --raw "${IMAGE}:${VERSION}" | sha256sum | cut -d ' ' -f 1)"
            if ! sh scripts/release-linux-binary.sh manifest-list "${IMAGE}:${VERSION}@${held}" "$amd64" "$arm64"; then
              echo "${IMAGE}:${VERSION} is already in ghcr.io and is not the list of the two checked images; a released tag is never moved. Nothing tagged." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "${IMAGE}:${VERSION} already lists the two checked images (${held}); left as it is." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            case "$inspected" in
              *"${IMAGE}:${VERSION}: not found"*) ;;
              *)
                echo "ghcr.io could not say whether it holds ${IMAGE}:${VERSION}; nothing tagged: ${inspected}" | tee -a "$GITHUB_STEP_SUMMARY"
                exit 1
                ;;
            esac
            docker buildx imagetools create --tag "${IMAGE}:${VERSION}" \
              --annotation "index:org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --annotation "index:org.opencontainers.image.version=${VERSION}" \
              "${IMAGE}@${amd64}" "${IMAGE}@${arm64}"
          fi
          digest="sha256:$(docker buildx imagetools inspect --raw "${IMAGE}:${VERSION}" | sha256sum | cut -d ' ' -f 1)"
          mkdir -p images
          printf '%s:%s@%s\n' "$IMAGE" "$VERSION" "$digest" > images/IMAGES
          sh scripts/release-linux-binary.sh images-line images/IMAGES "$IMAGE" "$VERSION" | tee -a "$GITHUB_STEP_SUMMARY"
          sh scripts/release-linux-binary.sh manifest-list "$(cat images/IMAGES)" "$amd64" "$arm64" | tee -a "$GITHUB_STEP_SUMMARY"
          (cd images && sha256sum IMAGES > IMAGES.sha256)

      - name: Install cosign
        env:
          COSIGN_VERSION: '3.1.6'
          COSIGN_SHA256: 318a99ade4156a0c4113aa983b46c0a0830fa7896a096c63121ee47b610a94c6
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/cosign-linux-amd64" \
            "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64"
          echo "$COSIGN_SHA256  $RUNNER_TEMP/cosign-linux-amd64" | sha256sum --check --strict
          install -D -m 755 "$RUNNER_TEMP/cosign-linux-amd64" "$RUNNER_TEMP/cosign-bin/cosign"
          echo "$RUNNER_TEMP/cosign-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/cosign-bin/cosign" version

      - name: Sign the manifest list by its digest
        run: |
          set -euo pipefail
          line="$(cat images/IMAGES)"
          digest="${line##*@}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$line" = "${IMAGE}:${VERSION}@${digest}"
          cosign sign --yes "${IMAGE}@${digest}"
          echo "Signed ${IMAGE}@${digest}, the manifest list of ${IMAGE}:${VERSION}, by its digest." | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: images
          path: |
            images/IMAGES
            images/IMAGES.sha256
          if-no-files-found: error
          retention-days: 7

  # The only job with attestations: write, and with image-manifest the only one with id-token:
  # write; it runs on no pull request. It checks each artifact against the hash its job wrote,
  # writes SHA256SUMS, signs each asset with cosign (keyless, this workflow's identity) into
  # <asset>.sigstore.json, attests each asset's and the image's build provenance, and hands the
  # assets and their bundles to publish.
  sign:
    name: Sign and attest the release assets
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.gate.result == 'success' && needs.build.result == 'success' && needs.sbom.result == 'success' && (needs.image-manifest.result == 'success' || (needs.provenance.outputs.containerfile == 'false' && needs.image-manifest.result == 'skipped')) }}
    needs: [provenance, gate, build, sbom, image-manifest]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.provenance.outputs.version }}
      IMAGES_EXPECTED: ${{ needs.provenance.outputs.containerfile }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          pattern: b10x-spindle-*.tar.gz
          merge-multiple: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sbom
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: ${{ needs.provenance.outputs.containerfile == 'true' }}
        with:
          name: images
          path: dist

      # A commit without a Containerfile (a backfilled tag cut before the image existed) carries no
      # IMAGES; any other carries it.
      - name: Check each artifact against the hash its job wrote, then create the checksum manifest
        working-directory: dist
        run: |
          set -euo pipefail
          targets="x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-unknown-linux-musl aarch64-apple-darwin x86_64-apple-darwin"
          files=()
          for target in $targets; do
            files+=("b10x-spindle-${VERSION}-${target}.tar.gz")
          done
          files+=("b10x-spindle-${VERSION}.cdx.json")
          case "$IMAGES_EXPECTED" in
            true) files+=("IMAGES") ;;
            false) ;;
            *) echo "Whether the commit has an image is unknown ('$IMAGES_EXPECTED'); nothing checked." >&2; exit 1 ;;
          esac
          test "$(ls | wc -l)" -eq "$(( 2 * ${#files[@]} ))"
          for file in "${files[@]}"; do
            test -s "$file"
            test "$(wc -l < "$file.sha256")" -eq 1
            test "$(awk '{print $2}' "$file.sha256")" = "$file"
            sha256sum --check --strict "$file.sha256"
          done
          for file in "${files[@]}"; do
            cat "$file.sha256" >> SHA256SUMS
            rm "$file.sha256"
          done
          test "$(wc -l < SHA256SUMS)" -eq "${#files[@]}"

      - name: Install cosign
        env:
          COSIGN_VERSION: '3.1.6'
          COSIGN_SHA256: 318a99ade4156a0c4113aa983b46c0a0830fa7896a096c63121ee47b610a94c6
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/cosign-linux-amd64" \
            "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64"
          echo "$COSIGN_SHA256  $RUNNER_TEMP/cosign-linux-amd64" | sha256sum --check --strict
          install -D -m 755 "$RUNNER_TEMP/cosign-linux-amd64" "$RUNNER_TEMP/cosign-bin/cosign"
          echo "$RUNNER_TEMP/cosign-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/cosign-bin/cosign" version

      # Each asset SHA256SUMS lists, and SHA256SUMS itself, signed into <asset>.sigstore.json; the
      # same list, SHA256SUMS included, is the provenance attestation's subjects.
      - name: Sign each asset with cosign
        working-directory: dist
        run: |
          set -euo pipefail
          mapfile -t assets < <(awk '{ print $2 }' SHA256SUMS)
          test "${#assets[@]}" -eq "$(wc -l < SHA256SUMS)"
          assets+=(SHA256SUMS)
          for file in "${assets[@]}"; do
            test -s "$file"
            cosign sign-blob --yes --bundle "$file.sigstore.json" "$file" > /dev/null
            test -s "$file.sigstore.json"
            echo "Signed $file into $file.sigstore.json." | tee -a "$GITHUB_STEP_SUMMARY"
          done
          { cat SHA256SUMS; sha256sum SHA256SUMS; } > "$RUNNER_TEMP/subjects.sha256"
          test "$(wc -l < "$RUNNER_TEMP/subjects.sha256")" -eq "${#assets[@]}"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/subjects.sha256

      - id: image
        name: The image's digest from IMAGES
        if: ${{ needs.provenance.outputs.containerfile == 'true' }}
        working-directory: dist
        run: |
          set -euo pipefail
          line="$(cat IMAGES)"
          digest="${line##*@}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$line" = "${IMAGE}:${VERSION}@${digest}"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # The image's provenance, by the manifest list's digest, kept in the repository's
      # attestations; nothing is pushed to the registry.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ needs.provenance.outputs.containerfile == 'true' }}
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: false

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: dist
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Upload binaries to the release page
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.gate.result == 'success' && needs.build.result == 'success' && needs.sbom.result == 'success' && (needs.image-manifest.result == 'success' || (needs.provenance.outputs.containerfile == 'false' && needs.image-manifest.result == 'skipped')) && needs.sign.result == 'success' }}
    needs: [provenance, gate, build, sbom, image-manifest, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.provenance.outputs.tag }}
      VERSION: ${{ needs.provenance.outputs.version }}
      IMAGES_EXPECTED: ${{ needs.provenance.outputs.containerfile }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release
          path: dist

      - name: Install cosign
        env:
          COSIGN_VERSION: '3.1.6'
          COSIGN_SHA256: 318a99ade4156a0c4113aa983b46c0a0830fa7896a096c63121ee47b610a94c6
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/cosign-linux-amd64" \
            "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64"
          echo "$COSIGN_SHA256  $RUNNER_TEMP/cosign-linux-amd64" | sha256sum --check --strict
          install -D -m 755 "$RUNNER_TEMP/cosign-linux-amd64" "$RUNNER_TEMP/cosign-bin/cosign"
          echo "$RUNNER_TEMP/cosign-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/cosign-bin/cosign" version

      - name: Wait for the release page of the tag
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if gh release view "$TAG" --json tagName --jq .tagName >/dev/null 2>&1; then
              echo "Release page for $TAG found after $attempt check(s)."
              exit 0
            fi
            sleep 30
          done
          echo "No release page for $TAG after 30 minutes; nothing uploaded. Create the page through the bot and re-run this job." | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1

      # Each asset SHA256SUMS lists, and SHA256SUMS, goes up with its bundle, or nothing does.
      - name: Upload the archives, the SBOM, IMAGES, SHA256SUMS and the bundle of each
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum --check --strict SHA256SUMS
          mapfile -t assets < <(awk '{ print $2 }' SHA256SUMS)
          test "${#assets[@]}" -eq "$(wc -l < SHA256SUMS)"
          assets+=(SHA256SUMS)
          case "$IMAGES_EXPECTED ${assets[*]} " in
            "true "*" IMAGES "*) ;;
            "false "*" IMAGES "*) echo "IMAGES is in SHA256SUMS of a commit without an image; nothing uploaded." >&2; exit 1 ;;
            "false "*) ;;
            *) echo "IMAGES is missing, or whether the commit has an image is unknown ('$IMAGES_EXPECTED'); nothing uploaded." >&2; exit 1 ;;
          esac
          files=()
          for asset in "${assets[@]}"; do
            test -s "$asset"
            test -s "$asset.sigstore.json"
            files+=("$asset" "$asset.sigstore.json")
          done
          test "$(ls | wc -l)" -eq "${#files[@]}"
          existing="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          conflict=0
          for file in "${files[@]}"; do
            if printf '%s\n' "$existing" | grep -Fxq "$file"; then
              echo "Asset $file is already on the release page of $TAG; refusing to replace it." | tee -a "$GITHUB_STEP_SUMMARY"
              conflict=1
            fi
          done
          test "$conflict" -eq 0
          gh release upload "$TAG" "${files[@]}"
          if [ "$IMAGES_EXPECTED" = true ]; then
            echo "Image: $(cat IMAGES)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name' | tee -a "$GITHUB_STEP_SUMMARY"

      # The assets as a consumer gets them, downloaded back from the release page: each verified
      # with cosign against its bundle and with gh against its attestations: each signed by this
      # workflow at refs/heads/main or at this tag's ref, each at the tag's ref naming the tagged
      # commit, and one naming the commit expected for this run (the tagged commit on a tag push,
      # github.sha on a backfill); attestations of earlier runs, the tag run's or a backfill's at
      # another commit of main, stay beside it. A copy of one archive with one byte changed must
      # fail both; and the image by the line in IMAGES. The identity is this workflow at the tag's ref, or at refs/heads/main
      # for a backfill (workflow_dispatch), whose certificates name the commit of main the workflow
      # ran from (github.sha), not the tag's. Each command and its output go to the step summary;
      # any check that fails fails the run.
      - name: Verify the signatures and attestations of the assets on the release page and of the image
        env:
          COMMIT: ${{ needs.provenance.outputs.commit }}
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            push) ref="refs/tags/${TAG}"; commit="$COMMIT" ;;
            workflow_dispatch) ref=refs/heads/main; commit="$GITHUB_SHA" ;;
            *) echo "No signing identity for a $GITHUB_EVENT_NAME run; nothing verified." | tee -a "$GITHUB_STEP_SUMMARY" >&2; exit 1 ;;
          esac
          identity="https://github.com/${GH_REPO}/.github/workflows/release.yml@${ref}"
          at_main="https://github.com/${GH_REPO}/.github/workflows/release.yml@refs/heads/main"
          at_tag="https://github.com/${GH_REPO}/.github/workflows/release.yml@refs/tags/${TAG}"
          issuer=https://token.actions.githubusercontent.com
          signer="${GH_REPO}/.github/workflows/release.yml"
          summary="$GITHUB_STEP_SUMMARY"
          checked() {
            local status=0
            { printf '\n```console\n$'; printf ' %s' "$@"; printf '\n'; } >> "$summary"
            "$@" > "$RUNNER_TEMP/checked.out" 2>&1 || status=$?
            cat "$RUNNER_TEMP/checked.out" >> "$summary"
            printf 'exit %s\n```\n' "$status" >> "$summary"
            return "$status"
          }
          attested() {
            local status=0
            printf '\n```console\n$ gh attestation verify %s --repo %s --signer-workflow %s --format json\n' "$1" "$GH_REPO" "$signer" >> "$summary"
            gh attestation verify "$1" --repo "$GH_REPO" --signer-workflow "$signer" --format json \
              > "$RUNNER_TEMP/attested.json" 2> "$RUNNER_TEMP/attested.err" || status=$?
            cat "$RUNNER_TEMP/attested.err" >> "$summary"
            if [ "$status" -eq 0 ]; then
              jq -r '.[].verificationResult.signature.certificate | "signed by \(.buildSignerURI) at \(.sourceRepositoryDigest)"' \
                "$RUNNER_TEMP/attested.json" >> "$summary" 2>&1 || status=1
              # Slurped, so the output must be one JSON document: jq -e alone answers for the last of
              # several.
              if ! jq -e -s --arg commit "$commit" --arg tagged "$COMMIT" --arg main "$at_main" --arg tag "$at_tag" '
                length == 1
                and (.[0]
                     | type == "array" and length > 0
                       and ([.[] | .verificationResult.signature.certificate
                             | {signer: .buildSignerURI, named: .sourceRepositoryDigest}] as $all
                            | all($all[]; .signer == $main or .signer == $tag)
                              and all($all[]; .signer != $tag or .named == $tagged)
                              and any($all[]; .named == $commit)))
              ' "$RUNNER_TEMP/attested.json" > /dev/null 2>&1; then
                echo "Not every attestation is signed by $at_main or $at_tag, one at the tag's ref names a commit other than $COMMIT, or none names $commit." >> "$summary"
                status=1
              fi
            fi
            printf 'exit %s\n```\n' "$status" >> "$summary"
            return "$status"
          }
          echo "Identity: $identity; commit $commit." >> "$summary"
          failed=0
          verify="$RUNNER_TEMP/verify"
          rm -rf "$verify"
          mkdir -p "$verify"
          gh release download "$TAG" --dir "$verify"
          cd "$verify"
          checked sha256sum --check --strict SHA256SUMS || failed=1
          mapfile -t assets < <(awk '{ print $2 }' SHA256SUMS)
          assets+=(SHA256SUMS)
          for file in "${assets[@]}"; do
            checked cosign verify-blob --bundle "$file.sigstore.json" --certificate-identity "$identity" \
              --certificate-oidc-issuer "$issuer" "$file" || failed=1
            attested "$file" || failed=1
          done
          archive="$(awk '$2 ~ /\.tar\.gz$/ { print $2; exit }' SHA256SUMS)"
          changed="$RUNNER_TEMP/changed/$archive"
          mkdir -p "$RUNNER_TEMP/changed"
          cp "$archive" "$changed"
          offset=$(( $(wc -c < "$changed") / 2 ))
          byte="$(od -An -tu1 -j "$offset" -N 1 "$changed" | tr -d ' ')"
          printf "\\$(printf '%03o' $(( (byte + 1) % 256 )))" | dd of="$changed" bs=1 seek="$offset" count=1 conv=notrunc status=none
          if cmp -s "$archive" "$changed"; then
            echo "The copy of $archive is unchanged; the refusal is not checked." | tee -a "$summary"
            failed=1
          fi
          echo "A copy of $archive with byte $offset changed must fail both checks:" >> "$summary"
          if checked cosign verify-blob --bundle "$archive.sigstore.json" --certificate-identity "$identity" \
            --certificate-oidc-issuer "$issuer" "$changed"; then
            echo "cosign verified $archive with one byte changed." | tee -a "$summary"
            failed=1
          fi
          if attested "$changed"; then
            echo "gh verified the attestation of $archive with one byte changed." | tee -a "$summary"
            failed=1
          fi
          if [ "$IMAGES_EXPECTED" = true ]; then
            line="$(cat IMAGES)"
            checked cosign verify --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" "$line" || failed=1
            attested "oci://$line" || failed=1
          fi
          if [ "$failed" -ne 0 ]; then
            echo "A signature or attestation check failed; see the summary." | tee -a "$summary" >&2
            exit 1
          fi
          echo "Every asset on the release page of $TAG verifies against $identity." | tee -a "$summary"
